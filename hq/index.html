<style>

  --bg:#F4F3F6; --surface:#FFFFFF; --surface-2:#ECEAF0; --ink:#251C2E; --muted:#6B6475; --line:#DEDAE4;

  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141118; --surface:#1E1A24; --surface-2:#2A2432; --ink:#F2EEF6; --muted:#A99FB3; --line:#383040;
  --accent:#F5B23A; --hi:#B892E6; --hi-ink:#1A1420; --bar:#B892E6; --bar-dim:#4A3D5C;
  --good:#55C987; --bad:#F27560; --good-bg:#183324; --bad-bg:#3A1C17; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141118; --surface:#1E1A24; --surface-2:#2A2432; --ink:#F2EEF6; --muted:#A99FB3; --line:#383040;
  --accent:#F5B23A; --hi:#B892E6; --hi-ink:#1A1420; --bar:#B892E6; --bar-dim:#4A3D5C;
  --good:#55C987; --bad:#F27560; --good-bg:#183324; --bad-bg:#3A1C17; color-scheme:dark;
}

[hidden]{display:none !important}   /* .field etc. set display, which would otherwise un-hide them */
html,button,a,label,input,select{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:16px 28px calc(32px + env(safe-area-inset-bottom))}
@media (max-width:640px){ .wrap{padding:12px 16px calc(32px + env(safe-area-inset-bottom))} }
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:env(safe-area-inset-top)}
/* laptop first: brand, tabs and sign-out on one line; on a phone the tabs drop below */
header.bar{gap:20px;margin-bottom:8px} header.bar .tabs{flex:0 1 560px;margin:0 auto 0 0}
@media (max-width:760px){ header.bar{flex-wrap:wrap;gap:8px} header.bar .tabs{order:3;flex:1 1 100%;margin:4px 0 8px} }
header h1{font-size:18px;margin:8px 0}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.4}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.filters select,.filters input{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px}

.datebox input{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}

table.tx td{vertical-align:top} table.tx td.items{min-width:240px;font-size:13px} table.tx tr.off td{color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}

.tabs{overflow-x:auto;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
.tabs .sm{display:none} @media (max-width:560px){ .tabs .lg{display:none} .tabs .sm{display:inline} .tabs button{padding:9px 6px} }
.tabs button{flex:1 0 auto;white-space:nowrap;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.x{border:0;background:var(--surface-2);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}

.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}

.review ul{margin:6px 0 0;padding-left:18px}
.okmsg{background:var(--good-bg);color:var(--good);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
/* stores & people (B-17): list beside details on a computer */
.split{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px;align-items:start}

.item[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--hi)}
.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px} .detailgrid > .card{margin:0}
.detailgrid > .wide{grid-column:span 2}
@media (max-width:1100px){ .detailgrid{grid-template-columns:1fr} .detailgrid > .wide{grid-column:auto} }
/* menu: drinks beside toppings and promos on a computer */
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0 20px;align-items:start}
@media (max-width:900px){ .cols{grid-template-columns:1fr} }
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.card h2 + .person{border-top:0;padding-top:0}
.person.offp b{color:var(--muted);text-decoration:line-through}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.card > .btn,.card > .primary{margin-top:10px}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.warn{background:var(--bad-bg);color:var(--bad)}
/* andon (C-16): one light per store, same colors as the tablet's bar */
.andon{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle;background:var(--line)}
.andon.ok{background:var(--good)} .andon.wait{background:var(--accent)} .andon.bad{background:var(--bad)}
.linkbtn{background:none;border:0;padding:4px 0;font:inherit;font-size:13px;font-weight:600;color:var(--hi);text-decoration:underline;cursor:pointer}
.btnrow [aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:transparent}

.steps{margin:8px 0 12px;padding-left:20px} .steps li{margin-bottom:6px}
textarea.msg{width:100%;min-height:150px;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px} .btnrow > *{flex:1 1 120px}
.danger{color:var(--bad)}
.stepper{display:inline-flex;gap:6px;align-items:center} .stepper .btn{min-width:44px;min-height:44px;font-weight:800;font-size:18px;padding:0}
input.qty{font:inherit;font-size:16px;width:56px;min-height:44px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
@media (min-width:900px){ .sup-sum{position:sticky;top:12px;align-self:start} }
</style>

<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Sago Loco HQ — live sales per store (roadmap B-01). Read-only: HQ sees every store,
// a franchisee sees only their own stores (enforced by the database, not by this page).
const SB_URL = 'https://fsdaiiazdnkmsqwyxrcj.supabase.co';
const SB_KEY = 'sb_publishable_qv46qcVUERE-2ivDDbKKAA_eU7QZcS6';
// own storage key, so signing in here never replaces a store tablet's login on the same phone
const sb = supabase.createClient(SB_URL, SB_KEY, {auth:{storageKey:'slhq-auth', persistSession:true, autoRefreshToken:true}});

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const peso = n => '₱' + (Math.round(n*100)/100).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const SIZE = {R:'Regular', T:'Tall', G:'Grande'};
const PAY = {cash:'Cash', gcash:'GCash', grab:'Grab', panda:'Foodpanda'};
const phDate = (t=Date.now()) => new Date(t + 8*36e5).toISOString().slice(0,10);   // Manila calendar date
const addDays = (d,n) => phDate(Date.parse(d+'T12:00:00+08:00') + n*864e5);
const hourPH = iso => new Date(Date.parse(iso) + 8*36e5).getUTCHours();
const fmtH = h => (h%12||12) + (h<12?'am':'pm');

const V = {tab:'sales', stores:[], menu:{}, crew:{}, toppings:{}, promos:{}, store:'all', period:'day', date:phDate(), from:phDate(), to:phDate(),
  data:null, prev:null, sel:{}, txLimit:50, role:null, updated:null, loading:false};
let timer;

// ---------- sign in ----------
function renderSignin(msg){
  $('app').innerHTML = `<div class="signin"><p class="eyebrow">Sago Loco</p><h1>HQ sign in</h1>
    <p class="muted">For HQ and franchisees. Crew use the store tablet, not this page.</p>
    <form id="f" class="card">
      <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      ${msg ? `<div class="callout">${esc(msg)}</div>` : ''}
      <button class="primary" id="go">Sign in</button>
    </form>
    <p class="muted">Forgot your password? Franchisees: ask HQ for a new setup link. HQ: ask Claude.</p></div>`;
  $('f').addEventListener('submit', async e => {
    e.preventDefault(); $('go').disabled = true; $('go').textContent = 'Signing in…';
    const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
    if(error){ renderSignin('Wrong email or password.'); return }
    start();
  });
}

async function start(){
  // speed: the saved session is read on this device (no server trip; the database still checks every request),
  // then the role and everything the screens need are fetched together instead of one after another
  const {data:{session}} = await sb.auth.getSession();
  const user = session && session.user;
  if(!user){ renderSignin(); return }
  const [prof, st, menu, crew, tops, promos] = await Promise.all([
    sb.from('profiles').select('role').eq('user_id', user.id).maybeSingle(),
    sb.from('stores').select('id,name').order('name'),
    sb.from('menu_items').select('id,name'),
    sb.from('crew').select('id,name'),          // names for the transactions list and downloads
    sb.from('toppings').select('id,name'),
    sb.from('promos').select('id,name')
  ]);
  if(prof.error && /JWT|token|expired/i.test(prof.error.message||'')){ await sb.auth.signOut(); renderSignin(); return }
  if(prof.error || !prof.data || !['hq','franchisee','admin'].includes(prof.data.role)){
    await sb.auth.signOut(); renderSignin('This login is for a store tablet, not HQ. Use your own HQ or franchisee login.'); return;
  }
  V.role = prof.data.role;
  (crew.data||[]).forEach(c => V.crew[c.id] = c.name); (tops.data||[]).forEach(t => V.toppings[t.id] = t.name); (promos.data||[]).forEach(p => V.promos[p.id] = p.name);
  if(st.error || menu.error){ $('app').innerHTML = '<div class="wrap"><div id="body"></div></div>'; $('body').innerHTML = `<div class="callout">Couldn’t load stores. Check the internet and pull to refresh.</div>`; return }
  V.stores = st.data; menu.data.forEach(m => V.menu[m.id] = m.name);
  renderShell();
  clearInterval(timer); timer = setInterval(()=>{ if(V.tab==='sales' && V.R && V.R.live && !document.hidden) load(true) }, 60000);
  if(V.role!=='admin') cleanOldSelfies();
}
// 90-day rule, no exceptions: a backup to each store tablet's own daily clean-up, so photos still
// leave even if a store stops opening its POS. The database refuses to delete anything newer.
async function cleanOldSelfies(){
  try{
    const cut = new Date(Date.now() - 91*864e5).toLocaleDateString('en-CA');
    for(const s of V.stores){
      const dirs = await sb.storage.from('selfies').list(s.id, {limit:1000});
      if(dirs.error) continue;
      for(const d of dirs.data.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.name) && x.name < cut)){
        const files = await sb.storage.from('selfies').list(s.id + '/' + d.name, {limit:1000});
        if(!files.error && files.data.length) await sb.storage.from('selfies').remove(files.data.map(f => s.id + '/' + d.name + '/' + f.name));
      }
    }
  }catch(_){ /* tries again next time HQ opens */ }
}

// ---------- data ----------
// Sales for any period (B-19). Dates are Manila calendar dates as 'YYYY-MM-DD'; a range is [from, to).
const SALE_COLS = 'id,store_id,sale_no,crew_id,channel,pay,gross,discount,total,tendered,change_due,created_at,voided_at,void_reason,scratch_due,scratch_given,' +
  'sale_lines(menu_item_id,size,qty,base_price,toppings,toppings_price,promo_id,discount,net,sc_type)';
const CH = {walkin:'Walk-in', grab:'Grab', panda:'Foodpanda'};
const PERIODS = [['day','Day'],['week','Week'],['month','Month'],['year','Year'],['custom','Custom']];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dow = d => new Date(d+'T00:00:00Z').getUTCDay();
const daysBetween = (a,b) => Math.round((Date.parse(b+'T00:00:00Z') - Date.parse(a+'T00:00:00Z'))/864e5);
const monday = d => addDays(d, -((dow(d)+6)%7));
const addMonths = (ym, n) => { let [y,m] = ym.split('-').map(Number); m += n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y+'-'+String(m).padStart(2,'0') };
const fmtD = (d, o) => new Date(d+'T12:00:00+08:00').toLocaleDateString('en-PH', Object.assign({timeZone:'Asia/Manila'}, o||{month:'short', day:'numeric'}));
const timePH = iso => new Date(iso).toLocaleTimeString('en-PH', {timeZone:'Asia/Manila', hour:'numeric', minute:'2-digit'});
const dateOf = iso => phDate(Date.parse(iso));

// the period on screen → its dates, a name for it, and what it is compared with
function range(){
  const d = V.date, today = phDate();
  let from, to, label, prevFrom, prevTo, prevName;
  if(V.period==='day'){ from = d; to = addDays(d,1); label = fmtD(d,{weekday:'long', month:'short', day:'numeric', year:'numeric'});
    prevFrom = addDays(d,-7); prevTo = addDays(d,-6); prevName = 'last ' + fmtD(d,{weekday:'short'}) }
  else if(V.period==='week'){ from = monday(d); to = addDays(from,7); label = fmtD(from) + ' – ' + fmtD(addDays(to,-1),{month:'short', day:'numeric', year:'numeric'});
    prevFrom = addDays(from,-7); prevTo = from; prevName = 'the week before' }
  else if(V.period==='month'){ const ym = d.slice(0,7); from = ym+'-01'; to = addMonths(ym,1)+'-01'; label = MONTHS[+ym.slice(5)-1] + ' ' + ym.slice(0,4);
    prevFrom = addMonths(ym,-1)+'-01'; prevTo = from; prevName = MONTHS[+prevFrom.slice(5,7)-1] }
  else if(V.period==='year'){ const y = +d.slice(0,4); from = y+'-01-01'; to = (y+1)+'-01-01'; label = String(y); prevFrom = (y-1)+'-01-01'; prevTo = from; prevName = String(y-1) }
  else { from = V.from <= V.to ? V.from : V.to; const last = V.from <= V.to ? V.to : V.from; to = addDays(last,1);
    label = from===last ? fmtD(from,{weekday:'long', month:'short', day:'numeric', year:'numeric'}) : fmtD(from,{month:'short', day:'numeric', year:'numeric'}) + ' – ' + fmtD(last,{month:'short', day:'numeric', year:'numeric'});
    const n = daysBetween(from,to); prevFrom = addDays(from,-n); prevTo = from; prevName = n===1 ? 'the day before' : `the ${n} days before` }
  // a period still running is compared with the same number of days of the one before
  const live = from <= today && today < to, end = live ? addDays(today,1) : to;
  if(live && V.period!=='day' && V.period!=='custom'){ const n = daysBetween(from,end); prevTo = addDays(prevFrom,n); prevName = (n>1 ? `the first ${n} days of ` : 'the first day of ') + prevName }
  return {from, to:end, fullTo:to, label, prevFrom, prevTo, prevName, live, days: daysBetween(from,end), future: from > today};
}
async function fetchRange(from, to, cols){
  const out = [];
  for(let i=0;;i+=1000){
    let q = sb.from('sales').select(cols).gte('created_at', from+'T00:00:00+08:00').lt('created_at', to+'T00:00:00+08:00').order('created_at').order('id').range(i, i+999);
    if(V.store!=='all') q = q.eq('store_id', V.store);
    const r = await q; if(r.error) throw r.error;
    out.push(...r.data); if(r.data.length < 1000) return out;
  }
}
// a normal shift is under 16 hours; anything open longer was almost surely never closed
const STALE_HOURS = 16;
async function loadAlerts(){
  try{
    const cut = new Date(Date.now() - STALE_HOURS*3600e3).toISOString();
    const r = await sb.from('shifts').select('id,store_id,opened_at').is('closed_at', null).lt('opened_at', cut).order('opened_at');
    if(r.error || !$('alerts')) return;
    const name = id => (V.stores.find(s=>s.id===id)||{name:'A store'}).name;
    const when = t => new Date(t).toLocaleString('en-PH', {timeZone:'Asia/Manila', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    const age = t => { const h = Math.floor((Date.now() - Date.parse(t))/3600e3); return h >= 48 ? Math.floor(h/24) + ' days' : h + ' hours' };
    $('alerts').innerHTML = r.data.map(s => `<div class="callout" role="alert"><b>${esc(name(s.store_id))}: shift still open since ${when(s.opened_at)}</b> (${age(s.opened_at)}).
      Sales keep landing on that old shift until it is closed. Ask the store to close it on the tablet: ⚙ Settings → Close shift.</div>`).join('');
  }catch(_){ /* the warning is a helper; sales still show without it */ }
}
let loadSeq = 0;
async function load(quiet){
  loadAlerts();
  const R = range(), seq = ++loadSeq;
  V.R = R;
  if(R.future){ V.data = []; V.prev = []; if($('body')) renderBody(); return }
  if(!quiet && $('body')){ $('body').classList.add('skel'); if(!V.data) $('body').innerHTML = '<p class="empty">Loading sales…</p>' }
  V.loading = true; syncDownload();
  try{
    const [cur, prev] = await Promise.all([fetchRange(R.from, R.to, SALE_COLS), fetchRange(R.prevFrom, R.prevTo, 'total,voided_at')]);
    if(seq !== loadSeq) return;   // a newer choice replaced this one
    V.data = cur; V.prev = prev; V.updated = Date.now(); if(V.tab==='sales' && $('body')) renderBody();
  }catch(e){
    if(seq === loadSeq && !quiet && $('body')) $('body').innerHTML = `<div class="callout">Couldn’t load sales. Check the internet and try again.</div>`;
  }finally{ if(seq === loadSeq){ V.loading = false; syncDownload(); if($('body')) $('body').classList.remove('skel') } }
}

function crunch(sales){
  const ok = sales.filter(s => !s.voided_at), voided = sales.filter(s => s.voided_at);
  const net = ok.reduce((a,s)=>a+Number(s.total),0), disc = ok.reduce((a,s)=>a+Number(s.discount||0),0);
  const pay = {}, hours = Array(24).fill(0), hourN = Array(24).fill(0), items = {}, stores = {}, days = {}, months = {};
  let cups = 0, grande = 0, tops = 0, withTop = 0, scDue = 0, scGiven = 0;
  ok.forEach(s => {
    scDue += s.scratch_due||0; scGiven += s.scratch_given||0;
    const t = Number(s.total);
    pay[s.pay] = (pay[s.pay]||0) + t;
    const h = hourPH(s.created_at); hours[h] += t; hourN[h]++;
    const d = dateOf(s.created_at), dd = days[d] = days[d] || {v:0,n:0}; dd.v += t; dd.n++;
    const mm = months[d.slice(0,7)] = months[d.slice(0,7)] || {v:0,n:0}; mm.v += t; mm.n++;
    const st = stores[s.store_id] = stores[s.store_id] || {net:0,n:0}; st.net += t; st.n++;
    (s.sale_lines||[]).forEach(l => {
      cups += l.qty; if(l.size==='G') grande += l.qty;
      const tn = (l.toppings||[]).length; tops += tn*l.qty; if(tn) withTop += l.qty;
      const it = items[l.menu_item_id] = items[l.menu_item_id] || {q:0, net:0, R:0, T:0, G:0};
      it.q += l.qty; it.net += Number(l.net); it[l.size] += l.qty;
    });
  });
  return {n:ok.length, voids:voided.length, voidAmt:voided.reduce((a,s)=>a+Number(s.total),0), net, disc, avg: ok.length ? net/ok.length : 0,
    pay, hours, hourN, items, stores, days, months, cups, grande, tops, withTop, scDue, scGiven};
}

// the date controls change with the period: one date, a month, a year, or from–to
function drawDatebox(){
  const box = $('datebox'), today = phDate(), p = V.period;
  if(p==='custom'){
    box.innerHTML = `<label class="muted" for="dfrom">From</label><input type="date" id="dfrom" value="${V.from}" max="${today}">
      <label class="muted" for="dto">to</label><input type="date" id="dto" value="${V.to}" max="${today}">`;

  }
  const input = p==='month' ? `<input type="month" id="dpick" value="${V.date.slice(0,7)}" max="${today.slice(0,7)}" aria-label="Month">`
    : p==='year' ? `<select id="dpick" aria-label="Year">${Array.from({length:Math.max(1, +today.slice(0,4)-2025)}, (_,i)=>+today.slice(0,4)-i).map(y=>`<option ${+V.date.slice(0,4)===y?'selected':''}>${y}</option>`).join('')}</select>`
    : `<input type="date" id="dpick" value="${V.date}" max="${today}" aria-label="${p==='week'?'Any day in the week':'Date'}">`;

  const step = n => { V.date = p==='day' ? addDays(V.date,n) : p==='week' ? addDays(V.date,7*n) : p==='month' ? addMonths(V.date.slice(0,7),n)+'-01' : (+V.date.slice(0,4)+n)+'-01-01';

// bar chart: [{label, short, v, n}]; hover (computer) or tap (phone) shows the numbers
function barChart(id, b, hint){

  const tipFor = i => `<b>${esc(b[i].label)}</b> · ${peso(b[i].v)} · ${b[i].n} sale${b[i].n===1?'':'s'}`;
  const tip = sel!=null && b[sel] ? tipFor(sel) : (b[best] && b[best].v ? `${hint}: ${tipFor(best)}. ${matchMedia('(hover:hover)').matches ? 'Point at' : 'Tap'} a bar for details.` : '');
  return `<div class="chart"><div class="bars" data-chart="${id}">${b.map((x,i)=>`<button data-i="${i}" class="${x.v?'':'zero'}" aria-pressed="${sel===i}" aria-label="${esc(x.label)}: ${peso(x.v)}, ${x.n} sales"><i style="height:${x.v?Math.max(3,x.v/max*100):0}%"></i></button>`).join('')}</div>

}

      <div class="tablewrap"><table class="tx"><thead><tr><th>${multi?'Date & time':'Time'}</th>${allStores?'<th>Store</th>':''}<th>Sale</th><th>Crew</th><th>Type</th><th>Items</th><th class="r">Total</th></tr></thead>

// ---------- void from the office (HQ: any store; franchisee: own stores). The database stamps the time and who did it,
// refuses anything but the void fields, and a void can never be undone. The store tablet picks it up within 5 minutes.
const VOID_REASONS = ['Wrong item','Customer cancelled','Duplicate entry','Training / test'];
function openVoid(id){
  const s = (V.data||[]).find(x=>x.id===id); if(!s) return;
  let reason = null;
  openSheet('Void sale #' + s.sale_no, `<p><b>${esc(storeName(s.store_id))}</b> · ${esc(fmtD(dateOf(s.created_at)))} ${esc(timePH(s.created_at))} · ${esc(V.crew[s.crew_id]||'—')} · ${esc(CH[s.channel]||s.channel)}</p>
    <p class="muted">${(s.sale_lines||[]).map(l=>esc(lineText(l))).join('<br>')}</p>
    <p><b>${peso(Number(s.total))}</b> will be taken out of the sales totals. A void can’t be undone.</p>
    <div class="field"><label>Reason</label><div class="btnrow" id="v_reasons">${VOID_REASONS.map(r=>`<button class="btn" data-r="${esc(r)}" aria-pressed="false">${esc(r)}</button>`).join('')}</div></div>
    <div class="btnrow"><button class="btn" id="s_no">Cancel</button><button class="primary" id="v_yes" style="background:var(--bad);color:#fff" disabled>Void this sale</button></div>`);
  $('s_no').onclick = closeEditor;
  $('v_reasons').onclick = e => { const b = e.target.closest('[data-r]'); if(!b) return; reason = b.dataset.r;
    $('v_reasons').querySelectorAll('[data-r]').forEach(x => x.setAttribute('aria-pressed', x===b)); $('v_yes').disabled = false };
  busy($('v_yes'), 'Voiding…', async () => {
    if(!reason) throw new Error('Pick a reason first.');
    const r = await sb.from('sales').update({voided_at: new Date().toISOString(), void_reason: reason + ' · office'}).eq('id', id).is('voided_at', null).select('id');
    if(r.error) throw new Error(r.error.message.includes('reason') ? 'Pick a reason first.' : NET);
    if(!r.data || !r.data.length) throw new Error('This sale was already voided, or your login can’t void it. Refresh and check.');
    closeEditor(); load();
  });
}

// ---------- attendance (HQ: all stores; franchisee: own stores). Read-only: punches can't be edited by anyone. ----------
const T = {from:null, to:null, store:'all', rows:null, people:null, loading:false};
const PUNCH = {in:'Time in', bstart:'Break start', bend:'Break end', out:'Time out'};
const clock = iso => iso ? timePH(iso) : '—';
const hrs = ms => ms > 0 ? (Math.round(ms/36e5*100)/100) : 0;
function showTime(){
  const today = phDate();
  if(!T.from){ T.from = monday(today); T.to = today }

      <div class="seg" role="group" aria-label="Quick dates"><button data-q="today">Today</button><button data-q="week">This week</button><button data-q="lastweek">Last week</button><button data-q="month">This month</button></div>
      <div class="datebox"><label class="muted" for="t_from">From</label><input type="date" id="t_from" value="${T.from}" max="${today}">
        <label class="muted" for="t_to">to</label><input type="date" id="t_to" value="${T.to}" max="${today}"></div>

  $('t_store').value = T.store;

  $('t_from').onchange = e => { if(e.target.value){ T.from = e.target.value; loadTime() } };
  $('t_to').onchange = e => { if(e.target.value){ T.to = e.target.value; loadTime() } };
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const q = b.dataset.q, t = phDate();

    else if(q==='lastweek'){ T.from = addDays(monday(t),-7); T.to = addDays(monday(t),-1) }
    else { T.from = t.slice(0,8)+'01'; T.to = t }
    $('t_from').value = T.from; $('t_to').value = T.to; loadTime() });
  $('t_dl').onclick = downloadTime;

}
async function loadTime(){
  if(T.to < T.from){ const x = T.from; T.from = T.to; T.to = x }
  const seq = (T.seq = (T.seq||0) + 1);
  $('body').classList.add('skel');
  try{
    const out = [];
    for(let i=0;;i+=1000){
      let q = sb.from('time_logs').select('id,store_id,crew_id,type,at,flag,offline,photo_path')
        .gte('at', T.from+'T00:00:00+08:00').lt('at', addDays(T.to,1)+'T00:00:00+08:00').order('at').range(i, i+999);
      if(T.store!=='all') q = q.eq('store_id', T.store);
      const r = await q; if(r.error) throw r.error;
      out.push(...r.data); if(r.data.length < 1000) break;
    }
    if(seq !== T.seq) return;
    T.rows = attendanceDays(out); drawTime();
  }catch(e){ if(seq === T.seq) $('body').innerHTML = `<div class="callout">Couldn’t load attendance. Check the internet and try again.</div>` }
  finally{ if(seq === T.seq && $('body')) $('body').classList.remove('skel') }
}
// one row per person per day: first time-in, break, last time-out, hours worked (break taken out)
function attendanceDays(logs){
  const days = {};
  logs.forEach(l => {
    const k = l.crew_id + '|' + dateOf(l.at) + '|' + l.store_id;
    const d = days[k] = days[k] || {crew:l.crew_id, date:dateOf(l.at), store:l.store_id, in:null, bstart:null, bend:null, out:null, photos:[], flags:new Set()};
    if(l.type==='in' && !d.in) d.in = l.at;
    if(l.type==='bstart' && !d.bstart) d.bstart = l.at;
    if(l.type==='bend') d.bend = l.at;
    if(l.type==='out') d.out = l.at;
    if(l.photo_path) d.photos.push({type:l.type, at:l.at, path:l.photo_path});
    if(l.flag==='offline' || l.offline) d.flags.add('Punched offline (phone time)');
    if(l.flag==='clock') d.flags.add('Tablet clock was off (phone time)');
  });
  return Object.values(days).map(d => {
    if(!d.in) d.flags.add('No time-in');
    if(!d.out) d.flags.add(d.date===phDate() ? 'Still on shift' : 'No time-out');
    if(d.bstart && !d.bend) d.flags.add('Break not ended');
    const brk = d.bstart && d.bend ? Date.parse(d.bend) - Date.parse(d.bstart) : 0;
    d.breakMin = Math.round(brk/6e4);
    d.hours = d.in && d.out ? hrs(Date.parse(d.out) - Date.parse(d.in) - brk) : 0;
    d.flags = [...d.flags];
    return d;
  }).sort((a,b) => a.date===b.date ? (V.crew[a.crew]||'').localeCompare(V.crew[b.crew]||'') : b.date.localeCompare(a.date));
}

      ${rows.map((d,i)=>`<tr><td class="num">${esc(fmtD(d.date,{weekday:'short', month:'short', day:'numeric'}))}</td><td>${esc(V.crew[d.crew]||'—')}</td>${allStores?`<td>${esc(storeName(d.store))}</td>`:''}
        <td class="num">${clock(d.in)}</td><td class="num">${d.bstart?clock(d.bstart)+' – '+clock(d.bend)+(d.bend?` <span class="muted">(${d.breakMin} min)</span>`:''):'—'}</td><td class="num">${clock(d.out)}</td>
        <td class="r num">${d.hours?d.hours.toFixed(2):'—'}</td><td>${d.flags.map(f=>`<span class="tag ${f==='Still on shift'?'':'warn'}" style="margin:0 4px 4px 0">${esc(f)}</span>`).join('')}</td>
        <td>${d.photos.length?`<button class="linkbtn" data-ph="${i}">View ${d.photos.length}</button>`:'<span class="muted">—</span>'}</td></tr>`).join('')}
      </tbody></table></div><p class="muted" style="margin-top:8px">Times come from the database clock, not the tablet, unless a note says otherwise. Selfies are kept for 90 days.</p></div>` : ''}
  </div>`;
  document.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => showSelfies(T.rows[+b.dataset.ph]));
}

// ---------- download (B-20): what's on screen, as Excel (3 sheets) or CSV ----------
function syncDownload(){ const b = $('dl'); if(b) b.disabled = !!V.loading || !(V.data||[]).length }
function saleRows(){
  const sales = V.data || [], tx = [], lines = [], sum = {};
  sales.forEach(s => {
    const d = dateOf(s.created_at), t = timePH(s.created_at), status = s.voided_at ? 'Voided' : 'Counted', ls = s.sale_lines || [];
    tx.push({'Date':d, 'Time':t, 'Store':storeName(s.store_id), 'Sale #':s.sale_no, 'Crew':V.crew[s.crew_id]||'', 'Type':CH[s.channel]||s.channel, 'Paid by':PAY[s.pay]||s.pay,
      'Items':ls.map(lineText).join('; '), 'Cups':ls.reduce((a,l)=>a+l.qty,0), 'Gross':Number(s.gross), 'Discount':Number(s.discount||0), 'Total':Number(s.total),
      'Cash given':s.tendered!=null?Number(s.tendered):'', 'Change':s.change_due!=null?Number(s.change_due):'', 'Scratch cards due':s.scratch_due??'', 'Scratch cards given':s.scratch_given??'', 'Status':status, 'Void reason':s.void_reason||'',
      'Voided at':s.voided_at ? dateOf(s.voided_at)+' '+timePH(s.voided_at) : ''});
    ls.forEach(l => lines.push({'Date':d, 'Time':t, 'Store':storeName(s.store_id), 'Sale #':s.sale_no, 'Drink':V.menu[l.menu_item_id]||l.menu_item_id, 'Size':SIZE[l.size]||l.size,
      'Qty':l.qty, 'Drink price':Number(l.base_price), 'Toppings':(l.toppings||[]).map(toppingName).join(', '), 'Toppings price':Number(l.toppings_price||0),
      'Promo':l.promo_id ? (V.promos[l.promo_id]||l.promo_id) : '', 'Discount':Number(l.discount||0), 'Net':Number(l.net), 'Senior/PWD':l.sc_type||'', 'Sale status':status}));
    const k = d + '|' + s.store_id, x = sum[k] = sum[k] || {'Date':d, 'Store':storeName(s.store_id), 'Transactions':0, 'Cups':0, 'Gross':0, 'Discounts':0, 'Net sales':0,
      'Cash':0, 'GCash':0, 'Grab':0, 'Foodpanda':0, 'Voids':0, 'Voided amount':0};
    if(s.voided_at){ x['Voids']++; x['Voided amount'] += Number(s.total) }
    else { x['Transactions']++; x['Cups'] += ls.reduce((a,l)=>a+l.qty,0); x['Gross'] += Number(s.gross); x['Discounts'] += Number(s.discount||0); x['Net sales'] += Number(s.total); x[PAY[s.pay]] = (x[PAY[s.pay]]||0) + Number(s.total) }
  });
  const summary = Object.values(sum).sort((a,b)=>a.Date.localeCompare(b.Date) || a.Store.localeCompare(b.Store));
  summary.forEach(r => ['Gross','Discounts','Net sales','Cash','GCash','Grab','Foodpanda','Voided amount'].forEach(k => r[k] = Math.round(r[k]*100)/100));
  return {summary, tx, lines};
}
function fileBase(){ const R = V.R || range(), st = V.store==='all' ? 'All stores' : storeName(V.store), last = addDays(R.to,-1);
  return ('SagoLoco Sales ' + st + ' ' + (R.from===last ? R.from : R.from + ' to ' + last)).replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_') }
function saveBlob(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove() }, 1000) }
function toCSV(rows){
  if(!rows.length) return '';
  const cols = Object.keys(rows[0]), cell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s };
  return '﻿' + [cols.map(cell).join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\r\n');   // ﻿: Excel reads ₱ and ñ correctly
}
let xlsxLoading;
function loadXLSX(){ return window.XLSX ? Promise.resolve() : (xlsxLoading = xlsxLoading || new Promise((res, rej) => { const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = res; s.onerror = () => { xlsxLoading = null; rej(new Error('excel')) }; document.head.appendChild(s) })) }
function openDownload(){

    <div class="btnrow"><button class="btn" id="x_tx">CSV: transactions</button><button class="btn" id="x_items">CSV: items</button><button class="btn" id="x_sum">CSV: daily summary</button></div>
    <p class="muted">CSV files open in Excel, Google Sheets or Numbers.</p>`);
  const rows = saleRows(), base = fileBase();
  busy($('x_xlsx'), 'Preparing…', async () => {
    try{ await loadXLSX() }catch(_){ throw new Error('Couldn’t load the Excel maker. Check the internet, or use the CSV buttons below.') }
    const wb = XLSX.utils.book_new(), add = (r, name, widths) => { const ws = XLSX.utils.json_to_sheet(r.length ? r : [{}]); ws['!cols'] = widths.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb, ws, name) };
    add(rows.summary, 'Daily summary', [11,22,13,7,10,10,11,10,10,10,10,7,13]);
    add(rows.tx, 'Transactions', [11,9,22,7,12,10,10,60,6,9,9,9,10,9,9,8,8,18,18]);
    add(rows.lines, 'Items', [11,9,22,7,26,8,5,11,26,13,18,9,9,10,11]);
    XLSX.writeFile(wb, base + '.xlsx'); closeEditor();
  });
  const csv = (id, r, suffix) => $(id).onclick = () => { saveBlob(new Blob([toCSV(r)], {type:'text/csv;charset=utf-8'}), base + '_' + suffix + '.csv') };
  csv('x_tx', rows.tx, 'transactions'); csv('x_items', rows.lines, 'items'); csv('x_sum', rows.summary, 'daily_summary');
}

// ---------- menu & prices (HQ only; the database refuses edits from anyone else) ----------
// Nothing is ever deleted: past sales point at these items. "Hide from menu" takes it off the tablets.
const M = {drinks:[], toppings:[], promos:[], msg:''};
const LOCKED_PROMO = 'scpwd';   // Senior/PWD 20% is set by law
const slug = s => s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'item';
const newId = (name, list) => { let b = slug(name), id = b, i = 2; while(list.some(x=>x.id===id)) id = b + '-' + i++; return id };
const promoBase = x => x.kind==='free' ? 'Free drink (toppings still paid)' : x.kind==='amount' ? peso(+x.amount)+' off each cup' : x.kind==='upsize' ? 'Free upsize (Grande at the Tall price)' : x.kind==='mark' ? 'Record only (₱0 off)' : (+x.pct)+'% off';
// a promo limited to some drinks or one size says so (e.g. Frequency reward: Tall Golden Regal Mango only)
const promoDesc = x => promoBase(x) + ((x.drinks && x.drinks.length) || x.size ? ' · ' + (x.size ? ({R:'Regular',T:'Tall',G:'Grande'})[x.size] + ' ' : '') + (x.drinks && x.drinks.length ? x.drinks.map(id => (M.drinks.find(d=>d.id===id)||{name:id}).name).join(' / ') : 'any drink') + ' only' : '');
const priceTxt = o => o ? ['R','T','G'].filter(k=>o[k]!=null).map(k=>k+' '+peso(o[k])).join(' · ') : '';

async function showMenu(){

function readForm(){ const o = {}; document.querySelectorAll('#sheet input, #sheet select').forEach(i => o[i.id] = i.type==='checkbox' ? i.checked : i.value); return o }
function restoreForm(o){ Object.entries(o).forEach(([k,v]) => { const i = $(k); if(!i) return; if(i.type==='checkbox') i.checked = v; else i.value = v });
  if($('e_series')) $('e_newseries').hidden = $('e_series').value!=='__new';
  if($('e_kind')){ $('pctbox').hidden = $('e_kind').value!=='pct'; $('amtbox').hidden = $('e_kind').value!=='amount' } }

function checkEdit(){
  const f = readForm(); ED.form = f; ED.err = '';
  const {kind, row} = ED, lines = [], data = {};
  const name = (f.e_name||'').trim();
  if(!name){ ED.err = 'Enter a name.'; drawEditor(); return }
  data.name = name; data.active = !!f.e_active;
  if(row && row.name!==name) lines.push(`Name: ${row.name} → ${name}`);
  if(kind==='drink'){
    const series = f.e_series==='__new' ? (f.e_newseries||'').trim() : f.e_series;
    if(!series){ ED.err = 'Enter the new series name.'; drawEditor(); return }
    const w = {}, d = {}, p = {};
    for(const k of ['R','T','G']){ const a = num(f['w'+k]), b = num(f['d'+k]), c = num(f['p'+k]);
      if(Number.isNaN(a) || Number.isNaN(b) || Number.isNaN(c)){ ED.err = 'Prices must be numbers, like 85.'; drawEditor(); return }
      if(a!=null) w[k] = a; if(b!=null) d[k] = b; if(c!=null) p[k] = c }
    if(!Object.keys(w).length){ ED.err = 'Enter at least one walk-in price.'; drawEditor(); return }
    data.series = series; data.sizes = w;
    data.delivery = Object.keys(d).length ? d : null;   // "delivery" column = Grab prices
    data.panda = Object.keys(p).length ? p : null;
    const was = (o, k) => o && o[k]!=null ? o[k] : null, pz = v => v!=null ? peso(v) : 'none';
    if(row){
      if(row.series!==series) lines.push(`Series: ${row.series} → ${series}`);
      for(const k of ['R','T','G']){
        const o = row.sizes[k], n = w[k]; if(o!=n) lines.push(`Walk-in ${SIZE[k]}: ${pz(o)} → ${pz(n)}`);
        const og = was(row.delivery, k), ng = was(d, k); if(og!=ng) lines.push(`Grab ${SIZE[k]}: ${pz(og)} → ${pz(ng)}`);
        const op = was(row.panda, k), np = was(p, k); if(op!=np) lines.push(`Foodpanda ${SIZE[k]}: ${pz(op)} → ${pz(np)}`);
      }
    } else { lines.push(`${name} (${series})`, 'Walk-in: ' + priceTxt(w),
        data.delivery ? 'Grab: ' + priceTxt(d) : 'Not on Grab', data.panda ? 'Foodpanda: ' + priceTxt(p) : 'Not on Foodpanda');
      data.sort = Math.max(0, ...M.drinks.map(x=>x.sort)) + 1 }
  } else if(kind==='topping'){
    const p = num(f.e_price); if(p==null || Number.isNaN(p)){ ED.err = 'Enter the price, like 15.'; drawEditor(); return }
    data.price = p;
    if(row){ if(+row.price!==p) lines.push(`Price: ${peso(+row.price)} → ${peso(p)}`) } else lines.push(`${name} · ${peso(p)}`);
  } else {
    data.kind = f.e_kind; data.pct = null; data.amount = null;
    if(data.kind==='pct'){ const p = num(f.e_pct); if(p==null || Number.isNaN(p) || p<=0 || p>100){ ED.err = 'Percent must be between 1 and 100.'; drawEditor(); return } data.pct = p }
    if(data.kind==='amount'){ const a = num(f.e_amt); if(a==null || Number.isNaN(a) || a<=0){ ED.err = 'Enter the peso amount, like 10.'; drawEditor(); return } data.amount = a }
    const desc = promoBase;
    if(row){ if(desc(row)!==desc(data)) lines.push(`Type: ${desc(row)} → ${desc(data)}`) } else lines.push(`${name} · ${desc(data)}`);
  }
  if(row && row.active!==data.active) lines.push(data.active ? 'Put back on the menu' : 'Hide from the tablets');
  if(row && !lines.length){ closeEditor(); return }
  ED.review = {lines, data}; drawEditor();
}
async function saveEdit(){
  const {kind, row} = ED, data = Object.assign({}, ED.review.data), table = kind==='drink' ? 'menu_items' : kind==='topping' ? 'toppings' : 'promos';
  const list = kind==='drink' ? M.drinks : kind==='topping' ? M.toppings : M.promos;

    ED.err = r.error && /network|fetch/i.test(r.error.message||'') ? 'No internet. Nothing was changed; try again.' : 'Couldn’t save. Only HQ logins can change the menu.';

// ---------- menu in Excel (B-14): download, blank template, upload → review → publish ----------
// One row per drink (UTAK needs one row per size per app). The Code column ties a row to an existing item,
// so renames work; a blank Code means "new". Items missing from the file are left as they are.
const XL_SIZES = [['R','Regular'],['T','Tall'],['G','Grande']];
const XL_DRINK_COLS = ['Code','Series','Drink', ...['Walk-in','Grab','Foodpanda'].flatMap(c => XL_SIZES.map(([,n]) => c+' '+n)), 'On menu'];
const XL_HOWTO = [
  ['Sago Loco menu: how to use this file'],
  [''],
  ['1. Drinks: one row per drink. Type the price for each size it comes in; leave a size blank if it isn’t sold.'],
  ['2. Grab and Foodpanda: leave all three blank if the drink isn’t sold on that app.'],
  ['3. On menu: Yes or No. No hides it from the store tablets (past sales are kept).'],
  ['4. Code: leave it as it is. For a NEW drink, topping or promo, leave Code blank.'],
  ['5. To rename an item, change its name and keep its Code.'],
  ['6. Items you delete from this file are NOT removed from the menu. To remove one, set On menu to No.'],
  ['7. Promos: Type is “Free drink”, “Percent off” or “Peso off”. Percent is for Percent off (1 to 100); Amount is for Peso off (e.g. 10 = ₱10 off each cup).'],
  ['8. Senior / PWD 20% is set by law and can’t be changed here.'],
  ['9. Save the file, then in HQ → Menu & prices press “Upload”. You’ll see every change before anything is published.'],
];
const yes = v => !/^(no|n|false|0|off|hidden|hide)$/i.test(String(v ?? '').trim());
function menuSheets(blank){
  const d = blank ? [] : M.drinks.slice().sort((a,b)=>a.sort-b.sort);
  const drinks = d.map(x => { const r = {'Code':x.id, 'Series':x.series, 'Drink':x.name};
    [['Walk-in',x.sizes],['Grab',x.delivery],['Foodpanda',x.panda]].forEach(([c,o]) => XL_SIZES.forEach(([k,n]) => r[c+' '+n] = o && o[k]!=null ? Number(o[k]) : ''));
    r['On menu'] = x.active ? 'Yes' : 'No'; return r });
  const tops = (blank ? [] : M.toppings).map(t => ({'Code':t.id, 'Topping':t.name, 'Price':Number(t.price), 'On menu':t.active?'Yes':'No'}));
  const promos = (blank ? [] : M.promos).map(p => ({'Code':p.id, 'Promo':p.name, 'Type':p.kind==='free'?'Free drink':p.kind==='amount'?'Peso off':p.kind==='upsize'?'Free upsize':p.kind==='mark'?'Record only':'Percent off', 'Percent':p.kind==='pct'?Number(p.pct):'', 'Amount':p.kind==='amount'?Number(p.amount):'', 'On menu':p.active?'Yes':'No'}));
  return {drinks, tops, promos};
}
async function downloadMenu(blank){
  await loadXLSX();
  const s = menuSheets(blank), wb = XLSX.utils.book_new();
  const add = (rows, header, name, widths) => { const ws = XLSX.utils.json_to_sheet(rows, {header}); ws['!cols'] = widths.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb, ws, name) };
  add(s.drinks, XL_DRINK_COLS, 'Drinks', [14,18,28, ...Array(9).fill(11), 9]);
  add(s.tops, ['Code','Topping','Price','On menu'], 'Toppings', [14,24,9,9]);
  add(s.promos, ['Code','Promo','Type','Percent','Amount','On menu'], 'Promos', [14,24,13,9,9,9]);
  const how = XLSX.utils.aoa_to_sheet(XL_HOWTO); how['!cols'] = [{wch:110}]; XLSX.utils.book_append_sheet(wb, how, 'How to');
  XLSX.writeFile(wb, blank ? 'SagoLoco_Menu_Template.xlsx' : `SagoLoco_Menu_${phDate()}.xlsx`);

// read a price cell: blank → null, "₱85" / "85.00" → 85, anything else → NaN
function xlPrice(v){ if(v==null) return null; const s = String(v).replace(/[₱,\s]/g,'').replace(/^php/i,''); if(s==='') return null; const n = Number(s); return isFinite(n) && n >= 0 ? Math.round(n*100)/100 : NaN }
// find a sheet by name, ignoring case and spaces
function xlSheet(wb, name){ const k = wb.SheetNames.find(n => n.replace(/\s/g,'').toLowerCase()===name.toLowerCase()); return k ? XLSX.utils.sheet_to_json(wb.Sheets[k], {defval:'', raw:true}) : null }
const xlGet = (row, col) => { const k = Object.keys(row).find(c => c.replace(/\s+/g,' ').trim().toLowerCase()===col.toLowerCase()); return k==null ? '' : row[k] };
const sameObj = (a,b) => JSON.stringify(a||null)===JSON.stringify(b||null);

// compare the file with the live menu → {errors, changes, writes}
function planMenuUpload(wb){
  const errors = [], changes = {drinks:[], toppings:[], promos:[]}, writes = {menu_items:[], toppings:[], promos:[]};
  const drinksIn = xlSheet(wb,'Drinks'), topsIn = xlSheet(wb,'Toppings'), promosIn = xlSheet(wb,'Promos');
  if(!drinksIn && !topsIn && !promosIn){ errors.push('This file has no “Drinks”, “Toppings” or “Promos” sheet. Start from “Download menu” or “Blank template”.'); return {errors, changes, writes} }
  const pz = v => v!=null ? peso(v) : 'none', idsTaken = new Set(M.drinks.map(d=>d.id));
  let nextSort = Math.max(0, ...M.drinks.map(x=>x.sort)) + 1;

  const seen = new Set();
  (drinksIn||[]).forEach((r, i) => {
    const row = i + 2, code = String(xlGet(r,'Code')).trim(), name = String(xlGet(r,'Drink')).trim(), series = String(xlGet(r,'Series')).trim();
    if(!code && !name && !series && XL_DRINK_COLS.slice(3,12).every(c => String(xlGet(r,c)).trim()==='')) return;   // empty row
    const where = `Drinks row ${row}${name?` (${name})`:''}`;
    if(!name){ errors.push(`${where}: the Drink name is empty.`); return }
    if(!series){ errors.push(`${where}: the Series is empty (e.g. Golden Mango).`); return }
    const key = name.toLowerCase(); if(seen.has(key)){ errors.push(`${where}: “${name}” is in the file twice.`); return } seen.add(key);
    const prices = {}; let bad = false;
    for(const [c,col] of [['w','Walk-in'],['d','Grab'],['p','Foodpanda']]){ prices[c] = {};
      for(const [k,n] of XL_SIZES){ const v = xlPrice(xlGet(r, col+' '+n)); if(Number.isNaN(v)){ errors.push(`${where}: “${col} ${n}” must be a number like 85.`); bad = true } else if(v!=null) prices[c][k] = v } }
    if(bad) return;
    if(!Object.keys(prices.w).length){ errors.push(`${where}: needs at least one Walk-in price.`); return }
    const data = {name, series, sizes: prices.w, delivery: Object.keys(prices.d).length ? prices.d : null, panda: Object.keys(prices.p).length ? prices.p : null, active: yes(xlGet(r,'On menu'))};
    const old = code ? M.drinks.find(d => d.id===code) : M.drinks.find(d => d.name.toLowerCase()===key);
    if(code && !old){ errors.push(`${where}: Code “${code}” isn’t on the menu. For a new drink, leave Code blank.`); return }
    if(!old){
      const id = newId(name, [...idsTaken].map(id=>({id}))); idsTaken.add(id);
      writes.menu_items.push(Object.assign({id, sort: nextSort++, updated_at: new Date().toISOString()}, data));
      changes.drinks.push(`New: ${name} (${series}) · ${priceTxt(data.sizes)}${data.active?'':' · hidden'}`); return;
    }
    const lines = [];
    if(old.name!==name) lines.push(`name → ${name}`);
    if(old.series!==series) lines.push(`series ${old.series} → ${series}`);
    for(const [k,n] of XL_SIZES){
      const pairs = [['Walk-in', old.sizes, data.sizes], ['Grab', old.delivery, data.delivery], ['Foodpanda', old.panda, data.panda]];
      pairs.forEach(([c,o,nw]) => { const a = o && o[k]!=null ? Number(o[k]) : null, b = nw && nw[k]!=null ? nw[k] : null; if(a!==b) lines.push(`${c} ${n} ${pz(a)} → ${pz(b)}`) });
    }
    if(old.active!==data.active) lines.push(data.active ? 'back on the menu' : 'hidden from the tablets');
    if(lines.length){ writes.menu_items.push(Object.assign({id: old.id, sort: old.sort, updated_at: new Date().toISOString()}, data)); changes.drinks.push(`${old.name}: ${lines.join(' · ')}`) }
  });

  const seenT = new Set();
  (topsIn||[]).forEach((r, i) => {
    const row = i + 2, code = String(xlGet(r,'Code')).trim(), name = String(xlGet(r,'Topping')).trim(), price = xlPrice(xlGet(r,'Price'));
    if(!code && !name && price==null) return;
    const where = `Toppings row ${row}${name?` (${name})`:''}`;
    if(!name){ errors.push(`${where}: the Topping name is empty.`); return }
    if(price==null || Number.isNaN(price)){ errors.push(`${where}: Price must be a number like 15.`); return }
    if(seenT.has(name.toLowerCase())){ errors.push(`${where}: “${name}” is in the file twice.`); return } seenT.add(name.toLowerCase());
    const data = {name, price, active: yes(xlGet(r,'On menu'))};
    const old = code ? M.toppings.find(t => t.id===code) : M.toppings.find(t => t.name.toLowerCase()===name.toLowerCase());
    if(code && !old){ errors.push(`${where}: Code “${code}” isn’t on the menu. For a new topping, leave Code blank.`); return }
    if(!old){ const id = newId(name, M.toppings.concat(writes.toppings)); writes.toppings.push(Object.assign({id}, data)); changes.toppings.push(`New: ${name} · ${peso(price)}`); return }
    const lines = [];
    if(old.name!==name) lines.push(`name → ${name}`);
    if(Number(old.price)!==price) lines.push(`${peso(Number(old.price))} → ${peso(price)}`);
    if(old.active!==data.active) lines.push(data.active ? 'back on the menu' : 'hidden');
    if(lines.length){ writes.toppings.push(Object.assign({id: old.id}, data)); changes.toppings.push(`${old.name}: ${lines.join(' · ')}`) }
  });

  const seenP = new Set();
  (promosIn||[]).forEach((r, i) => {
    const row = i + 2, code = String(xlGet(r,'Code')).trim(), name = String(xlGet(r,'Promo')).trim(), type = String(xlGet(r,'Type')).trim().toLowerCase();
    if(!code && !name && !type) return;
    const where = `Promos row ${row}${name?` (${name})`:''}`;
    if(code===LOCKED_PROMO) return;   // Senior/PWD is set by law; the row is ignored
    if(!name){ errors.push(`${where}: the Promo name is empty.`); return }
    const kind = /^(free )?upsize/.test(type) ? 'upsize' : /^record/.test(type) ? 'mark' : /^free/.test(type) ? 'free' : /^(percent|%|pct)/.test(type) ? 'pct' : /^(peso|php|₱|amount|fixed)/.test(type) ? 'amount' : null;
    if(!kind){ errors.push(`${where}: Type must be “Free drink”, “Percent off”, “Peso off”, “Free upsize” or “Record only”.`); return }
    let pct = null, amount = null;
    if(kind==='pct'){ pct = xlPrice(xlGet(r,'Percent')); if(pct==null || Number.isNaN(pct) || pct<=0 || pct>100){ errors.push(`${where}: Percent must be between 1 and 100.`); return } }
    if(kind==='amount'){ amount = xlPrice(xlGet(r,'Amount')); if(amount==null || Number.isNaN(amount) || amount<=0){ errors.push(`${where}: Amount must be a peso amount like 10.`); return } }
    if(seenP.has(name.toLowerCase())){ errors.push(`${where}: “${name}” is in the file twice.`); return } seenP.add(name.toLowerCase());
    const data = {name, kind, pct, amount, active: yes(xlGet(r,'On menu'))}, desc = promoBase;
    const old = code ? M.promos.find(p => p.id===code) : M.promos.find(p => p.name.toLowerCase()===name.toLowerCase());
    if(old && old.id===LOCKED_PROMO) return;
    if(code && !old){ errors.push(`${where}: Code “${code}” isn’t on the menu. For a new promo, leave Code blank.`); return }
    if(!old){ const id = newId(name, M.promos.concat(writes.promos)); writes.promos.push(Object.assign({id}, data)); changes.promos.push(`New: ${name} · ${desc(data)}`); return }
    const lines = [];
    if(old.name!==name) lines.push(`name → ${name}`);
    if(desc(old)!==desc(data)) lines.push(`${desc(old)} → ${desc(data)}`);
    if(old.active!==data.active) lines.push(data.active ? 'available again' : 'hidden');
    if(lines.length){ writes.promos.push(Object.assign({id: old.id}, data)); changes.promos.push(`${old.name}: ${lines.join(' · ')}`) }
  });
  return {errors, changes, writes};
}

function openMenuUpload(){
  openSheet('Upload menu from Excel', `<p>Choose an Excel file made from <b>Download menu</b> or <b>Blank template</b>. Nothing changes until you review and confirm.</p>
    <div class="field"><input type="file" id="u_file" accept=".xlsx,.xls,.csv"></div><div id="u_out"></div>`);
  $('u_file').onchange = async e => {
    const f = e.target.files[0]; if(!f) return; sheetErr(''); $('u_out').innerHTML = '<p class="muted">Reading the file…</p>';
    try{
      await loadXLSX();
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
      // a single-sheet CSV is read as the Drinks sheet
      if(/\.csv$/i.test(f.name) && wb.SheetNames.length===1){ wb.Sheets['Drinks'] = wb.Sheets[wb.SheetNames[0]]; wb.SheetNames = ['Drinks'] }
      showMenuPlan(planMenuUpload(wb));
    }catch(err){ $('u_out').innerHTML = ''; sheetErr(err && err.message==='excel' ? 'Couldn’t load the Excel reader. Check the internet and try again.' : 'Couldn’t read this file. Save it as an Excel workbook (.xlsx) and try again.') }
  };
}
function showMenuPlan(plan){
  const {errors, changes, writes} = plan, n = changes.drinks.length + changes.toppings.length + changes.promos.length;
  const list = (title, items) => items.length ? `<h3>${title} (${items.length})</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';
  if(errors.length){
    $('u_out').innerHTML = `<div class="callout"><b>Fix ${errors.length===1?'this':'these '+errors.length+' things'} in the file, then upload it again. Nothing was changed.</b><ul>${errors.slice(0,30).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${errors.length>30?`<p>…and ${errors.length-30} more.</p>`:''}</div>`;
    return;
  }
  if(!n){ $('u_out').innerHTML = `<div class="okmsg">The file matches the menu exactly. Nothing to change.</div>`; return }
  $('u_out').innerHTML = `<div class="review"><b>${n} change${n===1?'':'s'} to publish</b>${list('Drinks', changes.drinks)}${list('Toppings', changes.toppings)}${list('Promos', changes.promos)}
      <p class="muted">Items not in the file stay as they are.</p></div>
    <div class="btnrow"><button class="btn" id="u_cancel">Cancel</button><button class="primary" id="u_go">Confirm & publish</button></div>`;
  $('u_cancel').onclick = closeEditor;
  busy($('u_go'), 'Publishing…', async () => {
    const done = [];
    for(const [table, rows] of Object.entries(writes)){
      if(!rows.length) continue;
      const r = await sb.from(table).upsert(rows).select('id');
      if(r.error || !r.data || r.data.length !== rows.length){
        const net = r.error && /fetch|network/i.test(r.error.message||'');
        throw new Error((done.length ? `Saved ${done.join(' and ')}, but ` : '') + (net ? 'the internet dropped before ' + table.replace('menu_items','drinks') + ' were saved. Upload the same file again; finished changes will simply show as “no change”.' : 'Couldn’t save ' + table.replace('menu_items','drinks') + '. Only HQ logins can change the menu.'));
      }
      done.push(table.replace('menu_items','drinks'));
    }
    M.msg = `Published ${n} change${n===1?'':'s'} from Excel. Tablets update within 5 minutes.`;
    closeEditor(); showMenu();
  });
}

// ---------- stores & people (B-17) ----------
// HQ: add stores, give each one a franchisee login, a tablet login and crew. Franchisees: their own stores' crew.
// Logins are made by the "hq-people" server function (it holds the admin key; this page never does).
// Stores and crew are written straight to the database, whose access rules allow HQ (any store) and
// a franchisee (own stores, crew only). Nothing is deleted: people and stores are turned off instead.
const P = {stores:[], crew:[], people:[], pin:{}, sel:null, msg:''};
const NET = 'Couldn’t reach the server. Check the internet and try again.';
async function hqCall(action, body){
  let r;
  try{ r = await sb.functions.invoke('hq-people', {body: Object.assign({action}, body||{})}) }catch(_){ throw new Error(NET) }
  if(r.error){ let m = NET; try{ const j = await r.error.context.json(); if(j && j.error) m = j.error }catch(_){} throw new Error(m) }
  return r.data;
}
const when = t => new Date(t).toLocaleString('en-PH', {timeZone:'Asia/Manila', month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
const storeOf = id => P.stores.find(s=>s.id===id);
const peopleAt = (id, role) => P.people.filter(p=>p.role===role && p.stores.includes(id));
const autoCode = name => (name.toUpperCase().replace(/[^A-Z0-9 ]/g,'').split(/\s+/).filter(Boolean)
  .map((w,i,a)=>a.length>1 ? w[0] : w.slice(0,3)).join('') || '').slice(0,4);

async function showStores(){
  if(!$('view')) return;
  $('view').innerHTML = `<p class="empty">Loading stores…</p>`;
  const hq = V.role==='hq';
  try{
    const [st, cr, pp, dv, lv] = await Promise.all([
      sb.from('stores').select('id,code,name,address,company_owned,vat_registered,active').order('name'),
      sb.from('crew').select('id,store_id,name,active').order('name'),
      hq ? hqCall('people') : Promise.resolve({people:[]}),
      sb.from('devices').select('*').then(r => r.data || [], () => []),
      // the newest app version = what pos.sagoloco.com serves right now
      fetch('/index.html', {cache:'no-store'}).then(r => r.text()).then(t => (t.match(/APP_VERSION = '([^']+)'/)||[])[1] || null).catch(() => null)
    ]);
    P.devices = dv; P.latest = lv;
    if(st.error || cr.error) throw new Error(NET);
    P.stores = st.data.sort((a,b)=>(b.active-a.active) || a.name.localeCompare(b.name));
    P.crew = cr.data; P.people = pp.people || [];
  }catch(e){
    if(!$('view')) return;
    $('view').innerHTML = `<div class="callout">${esc(e.message||NET)}</div><button class="btn" id="retry">Try again</button>`;
    $('retry').onclick = showStores; return;
  }
  V.stores = P.stores.map(s=>({id:s.id, name:s.name})).sort((a,b)=>a.name.localeCompare(b.name));   // Sales tab's store list stays in step
  if(P.sel && !storeOf(P.sel)) P.sel = null;
  if(!hq && P.stores.length===1) P.sel = P.stores[0].id;   // a franchisee with one store goes straight to it
  drawStores();
}
// andon (C-16): the store's light from its tablet check-ins (every 5 min while online).
// red = a sale was refused, or sales were waiting when the tablet went quiet (>15 min); amber = sales waiting to send;
// green = checked in within 15 min with nothing waiting; grey = quiet with nothing waiting (closed or tablet off: nothing at risk)
function andonOf(devs){
  if(!devs.length) return {c:'', t:'No tablet check-in yet'};
  const quiet = d => Date.now() - Date.parse(d.last_seen) > 15*6e4;
  if(devs.some(d => d.failed_n > 0)) return {c:'bad', t:'Sales couldn’t sync · see Tablet check-in'};
  if(devs.some(d => d.outbox_n > 0 && quiet(d))) return {c:'bad', t:'Sales waiting on a tablet that went quiet'};
  if(devs.some(d => d.outbox_n > 0)) return {c:'wait', t:'Sales waiting to send'};
  if(devs.some(d => !quiet(d))) return {c:'ok', t:'All synced'};
  return {c:'', t:'Quiet · tablet off or store closed'};
}
const storeDevs = id => (P.devices||[]).filter(d=>d.store_id===id).sort((a,b)=>b.last_seen.localeCompare(a.last_seen));
const andonDot = a => `<i class="andon ${a.c}" title="${esc(a.t)}" aria-label="${esc(a.t)}" role="img"></i>`;
const wideStores = () => innerWidth >= 900 && P.stores.length > 0;
function drawStores(){
  if(V.tab!=='stores' || !$('view')) return;
  if(wideStores()){   // computer: list on the left, the chosen store on the right
    if(!P.sel || !storeOf(P.sel)) P.sel = P.stores[0].id;
    $('view').innerHTML = `<div class="split"><aside id="pane-list"></aside><section id="pane-detail"></section></div>`;
    renderStoreList($('pane-list')); renderStore($('pane-detail'));
  } else P.sel ? renderStore($('view')) : renderStoreList($('view'));
}
let wasWide = null;
addEventListener('resize', () => { const w = innerWidth >= 900; if(wasWide !== null && w !== wasWide && V.tab==='stores') drawStores(); wasWide = w });

function renderStoreList(el){
  const hq = V.role==='hq', wide = wideStores();
  const row = s => {
    const fr = peopleAt(s.id,'franchisee').filter(f=>!f.off), tab = peopleAt(s.id,'device')[0];
    const n = P.crew.filter(c=>c.store_id===s.id && c.active).length;
    const bits = [];
    if(hq){
      bits.push(fr.length ? 'Franchisee: ' + fr.map(f=>f.name||f.email).join(', ') : s.company_owned ? 'Company-owned' : 'No franchisee login yet');
      bits.push(!tab ? 'No tablet login yet' : tab.off ? 'Tablet turned off' : 'Tablet login ready');
    }
    bits.push(n + ' crew');
    return `<button class="item ${s.active?'':'off'}" data-store="${s.id}" ${wide && s.id===P.sel ? 'aria-current="true"' : ''}><div><div class="nm">${andonDot(andonOf(storeDevs(s.id)))}${esc(s.name)}<span class="tag">${esc(s.code)}</span>${s.active?'':'<span class="tag">Closed</span>'}</div>
      <div class="pr">${bits.map(esc).join(' · ')}</div></div><span class="chev">›</span></button>`;
  };
  el.innerHTML = `${P.msg && !wide?`<div class="okmsg">${esc(P.msg)}</div>`:''}
    <p class="muted">${hq ? 'Each store needs three things: a franchisee login (if franchised), a tablet login for the counter, and its crew. Nothing here is ever deleted; people and stores are turned off instead.'
      : 'Tap a store to add crew, reset a forgotten PIN, or turn off someone who left.'}</p>
    <div class="sec"><h2>Stores</h2>${hq?'<button class="btn" id="addStore">+ Add store</button>':''}</div>
    <div class="list">${P.stores.map(row).join('') || '<p class="empty">No stores yet.</p>'}</div>
    ${hq ? staffSection() : ''}`;
  if(!wide) P.msg = '';
  if(hq) bindStaff();
  document.querySelectorAll('[data-store]').forEach(b => b.onclick = () => { P.sel = b.dataset.store; P.msg = ''; drawStores(); if(!wide) window.scrollTo(0,0) });
  if($('addStore')) $('addStore').onclick = () => storeForm(null);
}

  const fr = peopleAt(s.id,'franchisee'), tab = peopleAt(s.id,'device')[0];

  if($('back')) $('back').onclick = () => { P.sel = null; P.showOff = false; drawStores() };

  if($('editStore')) $('editStore').onclick = () => storeForm(s);
  if($('addFr')) $('addFr').onclick = () => franchiseeForm(s);
  if($('mkTab')) $('mkTab').onclick = () => confirmSheet('Create tablet login', `This makes the login that the ${s.name} counter tablet signs in with. You’ll see its email and password once, on the next screen.`, 'Create tablet login',

  document.querySelectorAll('[data-link]').forEach(b => b.onclick = () => runSheet('Making a setup link…', async () => {
