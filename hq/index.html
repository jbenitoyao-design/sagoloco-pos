<style>

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141118; --surface:#1E1A24; --surface-2:#2A2432; --ink:#F2EEF6; --muted:#A99FB3; --line:#383040;

  --good:#55C987; --bad:#F27560; --good-bg:#183324; --bad-bg:#3A1C17; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141118; --surface:#1E1A24; --surface-2:#2A2432; --ink:#F2EEF6; --muted:#A99FB3; --line:#383040;

  --good:#55C987; --bad:#F27560; --good-bg:#183324; --bad-bg:#3A1C17; color-scheme:dark;

html,button,a,label,input,select{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}

.wrap{max-width:1240px;margin:0 auto;padding:16px 28px calc(32px + env(safe-area-inset-bottom))}

header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:env(safe-area-inset-top)}
/* laptop first: brand, tabs and sign-out on one line; on a phone the tabs drop below */

/* stores & people (B-17): list beside details on a computer */
.split{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:20px;align-items:start}
.split > aside{position:sticky;top:12px}
.item[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--hi)}

.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0 20px;align-items:start}

.person{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}

.acts{display:flex;gap:6px;flex-wrap:wrap}
.card > .btn,.card > .primary{margin-top:10px}

textarea.msg{width:100%;min-height:150px;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px} .btnrow > *{flex:1 1 120px}
.danger{color:var(--bad)}

<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Sago Loco HQ — live sales per store (roadmap B-01). Read-only: HQ sees every store,
// a franchisee sees only their own stores (enforced by the database, not by this page).
const SB_URL = 'https://fsdaiiazdnkmsqwyxrcj.supabase.co';
const SB_KEY = 'sb_publishable_qv46qcVUERE-2ivDDbKKAA_eU7QZcS6';
// own storage key, so signing in here never replaces a store tablet's login on the same phone
const sb = supabase.createClient(SB_URL, SB_KEY, {auth:{storageKey:'slhq-auth', persistSession:true, autoRefreshToken:true}});

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const peso = n => '₱' + (Math.round(n*100)/100).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const SIZE = {R:'Regular', T:'Tall', G:'Grande'};
const PAY = {cash:'Cash', gcash:'GCash', grab:'Grab', panda:'Foodpanda'};
const phDate = (t=Date.now()) => new Date(t + 8*36e5).toISOString().slice(0,10);   // Manila calendar date
const addDays = (d,n) => phDate(Date.parse(d+'T12:00:00+08:00') + n*864e5);
const hourPH = iso => new Date(Date.parse(iso) + 8*36e5).getUTCHours();
const fmtH = h => (h%12||12) + (h<12?'am':'pm');

const V = {tab:'sales', stores:[], menu:{}, crew:{}, toppings:{}, promos:{}, store:'all', period:'day', date:phDate(), from:phDate(), to:phDate(),
  data:null, prev:null, sel:{}, txLimit:50, role:null, updated:null, loading:false};
let timer;

// ---------- sign in ----------
function renderSignin(msg){
  $('app').innerHTML = `<div class="signin"><p class="eyebrow">Sago Loco</p><h1>HQ sign in</h1>
    <p class="muted">For HQ and franchisees. Crew use the store tablet, not this page.</p>
    <form id="f" class="card">
      <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      ${msg ? `<div class="callout">${esc(msg)}</div>` : ''}
      <button class="primary" id="go">Sign in</button>
    </form>
    <p class="muted">Forgot your password? Franchisees: ask HQ for a new setup link. HQ: ask Claude.</p></div>`;
  $('f').addEventListener('submit', async e => {
    e.preventDefault(); $('go').disabled = true; $('go').textContent = 'Signing in…';
    const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
    if(error){ renderSignin('Wrong email or password.'); return }
    start();
  });
}

async function start(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ renderSignin(); return }
  const prof = await sb.from('profiles').select('role').eq('user_id', user.id).maybeSingle();
  if(prof.error || !prof.data || !['hq','franchisee'].includes(prof.data.role)){
    await sb.auth.signOut(); renderSignin('This login is for a store tablet, not HQ. Use your own HQ or franchisee login.'); return;
  }
  V.role = prof.data.role;
  const [st, menu, crew, tops, promos] = await Promise.all([
    sb.from('stores').select('id,name').order('name'),
    sb.from('menu_items').select('id,name'),
    sb.from('crew').select('id,name'),          // names for the transactions list and downloads
    sb.from('toppings').select('id,name'),
    sb.from('promos').select('id,name')
  ]);
  (crew.data||[]).forEach(c => V.crew[c.id] = c.name); (tops.data||[]).forEach(t => V.toppings[t.id] = t.name); (promos.data||[]).forEach(p => V.promos[p.id] = p.name);
  if(st.error || menu.error){ $('app').innerHTML = '<div class="wrap"><div id="body"></div></div>'; $('body').innerHTML = `<div class="callout">Couldn’t load stores. Check the internet and pull to refresh.</div>`; return }
  V.stores = st.data; menu.data.forEach(m => V.menu[m.id] = m.name);
  renderShell();
  clearInterval(timer); timer = setInterval(()=>{ if(V.tab==='sales' && V.R && V.R.live && !document.hidden) load(true) }, 60000);
  cleanOldSelfies();
}
// 90-day rule, no exceptions: a backup to each store tablet's own daily clean-up, so photos still
// leave even if a store stops opening its POS. The database refuses to delete anything newer.
async function cleanOldSelfies(){
  try{
    const cut = new Date(Date.now() - 91*864e5).toLocaleDateString('en-CA');
    for(const s of V.stores){
      const dirs = await sb.storage.from('selfies').list(s.id, {limit:1000});
      if(dirs.error) continue;
      for(const d of dirs.data.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.name) && x.name < cut)){
        const files = await sb.storage.from('selfies').list(s.id + '/' + d.name, {limit:1000});
        if(!files.error && files.data.length) await sb.storage.from('selfies').remove(files.data.map(f => s.id + '/' + d.name + '/' + f.name));
      }
    }
  }catch(_){ /* tries again next time HQ opens */ }
}

// ---------- data ----------
// Sales for any period (B-19). Dates are Manila calendar dates as 'YYYY-MM-DD'; a range is [from, to).
const SALE_COLS = 'id,store_id,sale_no,crew_id,channel,pay,gross,discount,total,tendered,change_due,created_at,voided_at,void_reason,' +
  'sale_lines(menu_item_id,size,qty,base_price,toppings,toppings_price,promo_id,discount,net,sc_type)';
const CH = {walkin:'Walk-in', grab:'Grab', panda:'Foodpanda'};
const PERIODS = [['day','Day'],['week','Week'],['month','Month'],['year','Year'],['custom','Custom']];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const dow = d => new Date(d+'T00:00:00Z').getUTCDay();
const daysBetween = (a,b) => Math.round((Date.parse(b+'T00:00:00Z') - Date.parse(a+'T00:00:00Z'))/864e5);
const monday = d => addDays(d, -((dow(d)+6)%7));
const addMonths = (ym, n) => { let [y,m] = ym.split('-').map(Number); m += n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y+'-'+String(m).padStart(2,'0') };
const fmtD = (d, o) => new Date(d+'T12:00:00+08:00').toLocaleDateString('en-PH', Object.assign({timeZone:'Asia/Manila'}, o||{month:'short', day:'numeric'}));
const timePH = iso => new Date(iso).toLocaleTimeString('en-PH', {timeZone:'Asia/Manila', hour:'numeric', minute:'2-digit'});
const dateOf = iso => phDate(Date.parse(iso));

// the period on screen → its dates, a name for it, and what it is compared with
function range(){
  const d = V.date, today = phDate();
  let from, to, label, prevFrom, prevTo, prevName;
  if(V.period==='day'){ from = d; to = addDays(d,1); label = fmtD(d,{weekday:'long', month:'short', day:'numeric', year:'numeric'});
    prevFrom = addDays(d,-7); prevTo = addDays(d,-6); prevName = 'last ' + fmtD(d,{weekday:'short'}) }
  else if(V.period==='week'){ from = monday(d); to = addDays(from,7); label = fmtD(from) + ' – ' + fmtD(addDays(to,-1),{month:'short', day:'numeric', year:'numeric'});
    prevFrom = addDays(from,-7); prevTo = from; prevName = 'the week before' }
  else if(V.period==='month'){ const ym = d.slice(0,7); from = ym+'-01'; to = addMonths(ym,1)+'-01'; label = MONTHS[+ym.slice(5)-1] + ' ' + ym.slice(0,4);
    prevFrom = addMonths(ym,-1)+'-01'; prevTo = from; prevName = MONTHS[+prevFrom.slice(5,7)-1] }
  else if(V.period==='year'){ const y = +d.slice(0,4); from = y+'-01-01'; to = (y+1)+'-01-01'; label = String(y); prevFrom = (y-1)+'-01-01'; prevTo = from; prevName = String(y-1) }
  else { from = V.from <= V.to ? V.from : V.to; const last = V.from <= V.to ? V.to : V.from; to = addDays(last,1);
    label = from===last ? fmtD(from,{weekday:'long', month:'short', day:'numeric', year:'numeric'}) : fmtD(from,{month:'short', day:'numeric', year:'numeric'}) + ' – ' + fmtD(last,{month:'short', day:'numeric', year:'numeric'});
    const n = daysBetween(from,to); prevFrom = addDays(from,-n); prevTo = from; prevName = n===1 ? 'the day before' : `the ${n} days before` }
  // a period still running is compared with the same number of days of the one before
  const live = from <= today && today < to, end = live ? addDays(today,1) : to;
  if(live && V.period!=='day' && V.period!=='custom'){ const n = daysBetween(from,end); prevTo = addDays(prevFrom,n); prevName = (n>1 ? `the first ${n} days of ` : 'the first day of ') + prevName }
  return {from, to:end, fullTo:to, label, prevFrom, prevTo, prevName, live, days: daysBetween(from,end), future: from > today};
}
async function fetchRange(from, to, cols){
  const out = [];
  for(let i=0;;i+=1000){
    let q = sb.from('sales').select(cols).gte('created_at', from+'T00:00:00+08:00').lt('created_at', to+'T00:00:00+08:00').order('created_at').order('id').range(i, i+999);
    if(V.store!=='all') q = q.eq('store_id', V.store);
    const r = await q; if(r.error) throw r.error;
    out.push(...r.data); if(r.data.length < 1000) return out;
  }
}
// a normal shift is under 16 hours; anything open longer was almost surely never closed
const STALE_HOURS = 16;
async function loadAlerts(){
  try{
    const cut = new Date(Date.now() - STALE_HOURS*3600e3).toISOString();
    const r = await sb.from('shifts').select('id,store_id,opened_at').is('closed_at', null).lt('opened_at', cut).order('opened_at');
    if(r.error || !$('alerts')) return;
    const name = id => (V.stores.find(s=>s.id===id)||{name:'A store'}).name;
    const when = t => new Date(t).toLocaleString('en-PH', {timeZone:'Asia/Manila', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    const age = t => { const h = Math.floor((Date.now() - Date.parse(t))/3600e3); return h >= 48 ? Math.floor(h/24) + ' days' : h + ' hours' };
    $('alerts').innerHTML = r.data.map(s => `<div class="callout" role="alert"><b>${esc(name(s.store_id))}: shift still open since ${when(s.opened_at)}</b> (${age(s.opened_at)}).
      Sales keep landing on that old shift until it is closed. Ask the store to close it on the tablet: ⚙ Settings → Close shift.</div>`).join('');
  }catch(_){ /* the warning is a helper; sales still show without it */ }
}
let loadSeq = 0;
async function load(quiet){
  loadAlerts();
  const R = range(), seq = ++loadSeq;
  V.R = R;
  if(R.future){ V.data = []; V.prev = []; if($('body')) renderBody(); return }
  if(!quiet && $('body')){ $('body').classList.add('skel'); if(!V.data) $('body').innerHTML = '<p class="empty">Loading sales…</p>' }
  V.loading = true; syncDownload();
  try{
    const [cur, prev] = await Promise.all([fetchRange(R.from, R.to, SALE_COLS), fetchRange(R.prevFrom, R.prevTo, 'total,voided_at')]);
    if(seq !== loadSeq) return;   // a newer choice replaced this one
    V.data = cur; V.prev = prev; V.updated = Date.now(); if(V.tab==='sales' && $('body')) renderBody();
  }catch(e){
    if(seq === loadSeq && !quiet && $('body')) $('body').innerHTML = `<div class="callout">Couldn’t load sales. Check the internet and try again.</div>`;
  }finally{ if(seq === loadSeq){ V.loading = false; syncDownload(); if($('body')) $('body').classList.remove('skel') } }
}

function crunch(sales){
  const ok = sales.filter(s => !s.voided_at), voided = sales.filter(s => s.voided_at);
  const net = ok.reduce((a,s)=>a+Number(s.total),0), disc = ok.reduce((a,s)=>a+Number(s.discount||0),0);
  const pay = {}, hours = Array(24).fill(0), hourN = Array(24).fill(0), items = {}, stores = {}, days = {}, months = {};
  let cups = 0, grande = 0, tops = 0, withTop = 0;
  ok.forEach(s => {
    const t = Number(s.total);
    pay[s.pay] = (pay[s.pay]||0) + t;
    const h = hourPH(s.created_at); hours[h] += t; hourN[h]++;
    const d = dateOf(s.created_at), dd = days[d] = days[d] || {v:0,n:0}; dd.v += t; dd.n++;
    const mm = months[d.slice(0,7)] = months[d.slice(0,7)] || {v:0,n:0}; mm.v += t; mm.n++;
    const st = stores[s.store_id] = stores[s.store_id] || {net:0,n:0}; st.net += t; st.n++;
    (s.sale_lines||[]).forEach(l => {
      cups += l.qty; if(l.size==='G') grande += l.qty;
      const tn = (l.toppings||[]).length; tops += tn*l.qty; if(tn) withTop += l.qty;
      const it = items[l.menu_item_id] = items[l.menu_item_id] || {q:0, net:0, R:0, T:0, G:0};
      it.q += l.qty; it.net += Number(l.net); it[l.size] += l.qty;
    });
  });
  return {n:ok.length, voids:voided.length, voidAmt:voided.reduce((a,s)=>a+Number(s.total),0), net, disc, avg: ok.length ? net/ok.length : 0,
    pay, hours, hourN, items, stores, days, months, cups, grande, tops, withTop};
}

function resetSel(){ V.sel = {}; V.txLimit = 50 }
// the date controls change with the period: one date, a month, a year, or from–to
function drawDatebox(){
  const box = $('datebox'), today = phDate(), p = V.period;
  if(p==='custom'){
    box.innerHTML = `<label class="muted" for="dfrom">From</label><input type="date" id="dfrom" value="${V.from}" max="${today}">
      <label class="muted" for="dto">to</label><input type="date" id="dto" value="${V.to}" max="${today}">`;
    $('dfrom').onchange = e => { if(e.target.value){ V.from = e.target.value; resetSel(); load() } };
    $('dto').onchange = e => { if(e.target.value){ V.to = e.target.value; resetSel(); load() } };
    return;
  }
  const input = p==='month' ? `<input type="month" id="dpick" value="${V.date.slice(0,7)}" max="${today.slice(0,7)}" aria-label="Month">`
    : p==='year' ? `<select id="dpick" aria-label="Year">${Array.from({length:Math.max(1, +today.slice(0,4)-2025)}, (_,i)=>+today.slice(0,4)-i).map(y=>`<option ${+V.date.slice(0,4)===y?'selected':''}>${y}</option>`).join('')}</select>`
    : `<input type="date" id="dpick" value="${V.date}" max="${today}" aria-label="${p==='week'?'Any day in the week':'Date'}">`;
  const isNow = range().live;
  box.innerHTML = `<button class="btn" id="dprev" aria-label="Previous ${p}">‹</button>${input}<button class="btn" id="dnext" aria-label="Next ${p}" ${isNow?'disabled':''}>›</button>
    ${isNow ? '' : `<button class="btn" id="dnow">${p==='day'?'Today':p==='week'?'This week':p==='month'?'This month':'This year'}</button>`}`;
  const step = n => { V.date = p==='day' ? addDays(V.date,n) : p==='week' ? addDays(V.date,7*n) : p==='month' ? addMonths(V.date.slice(0,7),n)+'-01' : (+V.date.slice(0,4)+n)+'-01-01';
    if(V.date > today) V.date = today; resetSel(); drawDatebox(); load() };

  if($('dnow')) $('dnow').onclick = () => { V.date = today; resetSel(); drawDatebox(); load() };
  $('dpick').onchange = e => { const v = e.target.value; if(!v) return;
    V.date = p==='month' ? v+'-01' : p==='year' ? v+'-01-01' : v; if(V.date > today) V.date = today; resetSel(); drawDatebox(); load() };
}

// bar chart: [{label, short, v, n}]; hover (computer) or tap (phone) shows the numbers
function barChart(id, b, hint){
  const max = Math.max(1, ...b.map(x=>x.v)), sel = V.sel[id], every = Math.max(1, Math.ceil(b.length / (innerWidth > 900 ? 16 : 8)));
  const best = b.reduce((bi,x,i)=>x.v > b[bi].v ? i : bi, 0);
  const tipFor = i => `<b>${esc(b[i].label)}</b> · ${peso(b[i].v)} · ${b[i].n} sale${b[i].n===1?'':'s'}`;
  const tip = sel!=null && b[sel] ? tipFor(sel) : (b[best] && b[best].v ? `${hint}: ${tipFor(best)}. ${matchMedia('(hover:hover)').matches ? 'Point at' : 'Tap'} a bar for details.` : '');
  return `<div class="chart"><div class="bars" data-chart="${id}">${b.map((x,i)=>`<button data-i="${i}" class="${x.v?'':'zero'}" aria-pressed="${sel===i}" aria-label="${esc(x.label)}: ${peso(x.v)}, ${x.n} sales"><i style="height:${x.v?Math.max(3,x.v/max*100):0}%"></i></button>`).join('')}</div>
    <div class="axis">${b.map((x,i)=>`<span>${i%every===0?esc(x.short):''}</span>`).join('')}</div></div><div class="tip" id="tip-${id}">${tip}</div>`;
}
function bindCharts(charts){

    const id = el.dataset.chart, b = charts[id], tip = $('tip-'+id);

}

function saleRows(){

    ls.forEach(l => lines.push({'Date':d, 'Time':t, 'Store':storeName(s.store_id), 'Sale #':s.sale_no, 'Drink':V.menu[l.menu_item_id]||l.menu_item_id, 'Size':SIZE[l.size]||l.size,
      'Qty':l.qty, 'Drink price':Number(l.base_price), 'Toppings':(l.toppings||[]).map(toppingName).join(', '), 'Toppings price':Number(l.toppings_price||0),
      'Promo':l.promo_id ? (V.promos[l.promo_id]||l.promo_id) : '', 'Discount':Number(l.discount||0), 'Net':Number(l.net), 'Senior/PWD':l.sc_type||'', 'Sale status':status}));
    const k = d + '|' + s.store_id, x = sum[k] = sum[k] || {'Date':d, 'Store':storeName(s.store_id), 'Transactions':0, 'Cups':0, 'Gross':0, 'Discounts':0, 'Net sales':0,
      'Cash':0, 'GCash':0, 'Grab':0, 'Foodpanda':0, 'Voids':0, 'Voided amount':0};
    if(s.voided_at){ x['Voids']++; x['Voided amount'] += Number(s.total) }
    else { x['Transactions']++; x['Cups'] += ls.reduce((a,l)=>a+l.qty,0); x['Gross'] += Number(s.gross); x['Discounts'] += Number(s.discount||0); x['Net sales'] += Number(s.total); x[PAY[s.pay]] = (x[PAY[s.pay]]||0) + Number(s.total) }
  });
  const summary = Object.values(sum).sort((a,b)=>a.Date.localeCompare(b.Date) || a.Store.localeCompare(b.Store));
  summary.forEach(r => ['Gross','Discounts','Net sales','Cash','GCash','Grab','Foodpanda','Voided amount'].forEach(k => r[k] = Math.round(r[k]*100)/100));
  return {summary, tx, lines};
}
function fileBase(){ const R = V.R || range(), st = V.store==='all' ? 'All stores' : storeName(V.store), last = addDays(R.to,-1);

function toCSV(rows){

}

function readForm(){ const o = {}; document.querySelectorAll('#sheet input, #sheet select').forEach(i => o[i.id] = i.type==='checkbox' ? i.checked : i.value); return o }
function restoreForm(o){ Object.entries(o).forEach(([k,v]) => { const i = $(k); if(!i) return; if(i.type==='checkbox') i.checked = v; else i.value = v });
  if($('e_series')) $('e_newseries').hidden = $('e_series').value!=='__new';

function checkEdit(){
  const f = readForm(); ED.form = f; ED.err = '';
  const {kind, row} = ED, lines = [], data = {};
  const name = (f.e_name||'').trim();
  if(!name){ ED.err = 'Enter a name.'; drawEditor(); return }
  data.name = name; data.active = !!f.e_active;
  if(row && row.name!==name) lines.push(`Name: ${row.name} → ${name}`);
  if(kind==='drink'){
    const series = f.e_series==='__new' ? (f.e_newseries||'').trim() : f.e_series;
    if(!series){ ED.err = 'Enter the new series name.'; drawEditor(); return }
    const w = {}, d = {}, p = {};
    for(const k of ['R','T','G']){ const a = num(f['w'+k]), b = num(f['d'+k]), c = num(f['p'+k]);
      if(Number.isNaN(a) || Number.isNaN(b) || Number.isNaN(c)){ ED.err = 'Prices must be numbers, like 85.'; drawEditor(); return }
      if(a!=null) w[k] = a; if(b!=null) d[k] = b; if(c!=null) p[k] = c }
    if(!Object.keys(w).length){ ED.err = 'Enter at least one walk-in price.'; drawEditor(); return }
    data.series = series; data.sizes = w;
    data.delivery = Object.keys(d).length ? d : null;   // "delivery" column = Grab prices
    data.panda = Object.keys(p).length ? p : null;
    const was = (o, k) => o && o[k]!=null ? o[k] : null, pz = v => v!=null ? peso(v) : 'none';
    if(row){
      if(row.series!==series) lines.push(`Series: ${row.series} → ${series}`);
      for(const k of ['R','T','G']){
        const o = row.sizes[k], n = w[k]; if(o!=n) lines.push(`Walk-in ${SIZE[k]}: ${pz(o)} → ${pz(n)}`);
        const og = was(row.delivery, k), ng = was(d, k); if(og!=ng) lines.push(`Grab ${SIZE[k]}: ${pz(og)} → ${pz(ng)}`);
        const op = was(row.panda, k), np = was(p, k); if(op!=np) lines.push(`Foodpanda ${SIZE[k]}: ${pz(op)} → ${pz(np)}`);
      }
    } else { lines.push(`${name} (${series})`, 'Walk-in: ' + priceTxt(w),
        data.delivery ? 'Grab: ' + priceTxt(d) : 'Not on Grab', data.panda ? 'Foodpanda: ' + priceTxt(p) : 'Not on Foodpanda');
      data.sort = Math.max(0, ...M.drinks.map(x=>x.sort)) + 1 }
  } else if(kind==='topping'){
    const p = num(f.e_price); if(p==null || Number.isNaN(p)){ ED.err = 'Enter the price, like 15.'; drawEditor(); return }
    data.price = p;
    if(row){ if(+row.price!==p) lines.push(`Price: ${peso(+row.price)} → ${peso(p)}`) } else lines.push(`${name} · ${peso(p)}`);
  } else {
    data.kind = f.e_kind; data.pct = null;
    if(data.kind==='pct'){ const p = num(f.e_pct); if(p==null || Number.isNaN(p) || p<=0 || p>100){ ED.err = 'Percent must be between 1 and 100.'; drawEditor(); return } data.pct = p }
    const desc = x => x.kind==='free' ? 'Free drink' : (+x.pct)+'% off';
    if(row){ if(desc(row)!==desc(data)) lines.push(`Type: ${desc(row)} → ${desc(data)}`) } else lines.push(`${name} · ${desc(data)}`);
  }
  if(row && row.active!==data.active) lines.push(data.active ? 'Put back on the menu' : 'Hide from the tablets');
  if(row && !lines.length){ closeEditor(); return }
  ED.review = {lines, data}; drawEditor();
}

async function hqCall(action, body){
  let r;

  if(r.error){ let m = NET; try{ const j = await r.error.context.json(); if(j && j.error) m = j.error }catch(_){} throw new Error(m) }

}
const when = t => new Date(t).toLocaleString('en-PH', {timeZone:'Asia/Manila', month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});

const peopleAt = (id, role) => P.people.filter(p=>p.role===role && p.stores.includes(id));

    bits.push(n + ' crew');
    return `<button class="item ${s.active?'':'off'}" data-store="${s.id}" ${wide && s.id===P.sel ? 'aria-current="true"' : ''}><div><div class="nm">${esc(s.name)}<span class="tag">${esc(s.code)}</span>${s.active?'':'<span class="tag">Closed</span>'}</div>
      <div class="pr">${bits.map(esc).join(' · ')}</div></div><span class="chev">›</span></button>`;
  };
  el.innerHTML = `${P.msg && !wide?`<div class="okmsg">${esc(P.msg)}</div>`:''}
    <p class="muted">${hq ? 'Each store needs three things: a franchisee login (if franchised), a tablet login for the counter, and its crew. Nothing here is ever deleted; people and stores are turned off instead.'
      : 'Tap a store to add crew, reset a forgotten PIN, or turn off someone who left.'}</p>
    <div class="sec"><h2>Stores</h2>${hq?'<button class="btn" id="addStore">+ Add store</button>':''}</div>
    <div class="list">${P.stores.map(row).join('') || '<p class="empty">No stores yet.</p>'}</div>`;
  if(!wide) P.msg = '';
  document.querySelectorAll('[data-store]').forEach(b => b.onclick = () => { P.sel = b.dataset.store; P.msg = ''; drawStores(); if(!wide) window.scrollTo(0,0) });
  if($('addStore')) $('addStore').onclick = () => storeForm(null);
}

function renderStore(el){
  const hq = V.role==='hq', s = storeOf(P.sel), wide = wideStores();
  const fr = peopleAt(s.id,'franchisee'), tab = peopleAt(s.id,'device')[0];
  const crew = P.crew.filter(c=>c.store_id===s.id).sort((a,b)=>(b.active-a.active) || a.name.localeCompare(b.name));
  const back = !wide && (hq || P.stores.length > 1) ? `<button class="btn" id="back" style="margin-bottom:12px">‹ All stores</button>` : '';
  const kv = (k,v) => `<div class="row"><span class="l muted">${k}</span><span class="r">${esc(v)}</span></div>`;

  const details = `<div class="card" id="store-details"><h2>${esc(s.name)} <span class="tag">${esc(s.code)}</span>${s.active?'':'<span class="tag">Closed</span>'}</h2><div class="rows">
      ${kv('Address', s.address || '—')}${kv('Type', s.company_owned ? 'Company-owned' : 'Franchise')}${kv('Tax', s.vat_registered ? 'VAT-registered' : 'Non-VAT')}</div>
      ${hq ? `<button class="btn" id="editStore">Edit details</button>` : ''}</div>`;

  const frCard = !hq ? '' : `<div class="card" id="store-franchisee"><h2>Franchisee login</h2>
      ${fr.map(f=>`<div class="person ${f.off?'offp':''}"><div><b>${esc(f.name||f.email)}</b>
          <div class="muted">${esc(f.email)}${f.mobile?' · '+esc(f.mobile):''}</div>
          <div class="muted">${f.off ? 'Turned off' : f.signed_in_at ? 'Last signed in ' + when(f.signed_in_at) : '<span class="tag warn">Hasn’t set a password yet</span>'}</div></div>
        ${f.off ? '' : `<div class="acts"><button class="btn" data-link="${f.id}">${f.signed_in_at?'New setup link':'Send setup link'}</button><button class="btn danger" data-remove="${f.id}">Remove</button></div>`}</div>`).join('')
        || `<p class="muted">${s.company_owned ? 'Company-owned store: add a franchisee only if this store gets franchised.' : 'No franchisee login yet. Once added, they see this store’s sales and manage its crew. They never see other stores.'}</p>`}
      <button class="btn" id="addFr">+ Add franchisee</button></div>`;

  const tabCard = !hq ? '' : `<div class="card" id="store-tablet"><h2>Store tablet</h2>
      ${tab ? `<div class="person ${tab.off?'offp':''}"><div><b>${esc(tab.email)}</b>
          <div class="muted">${tab.off ? 'Turned off: this tablet can’t sign in or sync' : tab.signed_in_at ? 'Set up · last signed in ' + when(tab.signed_in_at) : '<span class="tag warn">Not set up on a tablet yet</span>'}</div></div>
          <div class="acts"><button class="btn" data-tabpw="${tab.id}">${tab.off?'Turn back on':'New password'}</button>${tab.off?'':`<button class="btn danger" data-taboff="${tab.id}">Turn off</button>`}</div></div>`
        : `<p class="muted">The tablet at the counter needs its own login. Create it here, then type it once on the tablet.</p><button class="primary" id="mkTab">Create tablet login</button>`}</div>`;

  const pinTxt = c => P.pin[c.id]===undefined ? '' : P.pin[c.id] ? 'PIN set' : 'No PIN yet: makes one on the tablet';
  const crewCard = `<div class="card" id="store-crew"><h2>Crew</h2>
      ${crew.map(c=>`<div class="person ${c.active?'':'offp'}"><div><b>${esc(c.name)}</b><div class="muted" data-pinfor="${c.id}">${c.active ? esc(pinTxt(c)) : 'Turned off'}</div></div>
        <div class="acts">${c.active ? `<button class="btn" data-pinreset="${c.id}" ${P.pin[c.id]?'':'hidden'}>Reset PIN</button><button class="btn danger" data-crewoff="${c.id}">Turn off</button>`
          : `<button class="btn" data-crewon="${c.id}">Turn back on</button>`}</div></div>`).join('') || '<p class="muted">No crew yet. Add each person who works the counter; they make their own 4-digit PIN the first time they use the tablet.</p>'}
      <button class="btn" id="addCrew">+ Add crew</button></div>`;

  el.innerHTML = `${back}${P.msg?`<div class="okmsg">${esc(P.msg)}</div>`:''}<div class="detailgrid">${details}${frCard}${tabCard}${crewCard}</div>`;
  P.msg = '';
  if($('back')) $('back').onclick = () => { P.sel = null; drawStores() };
  if($('editStore')) $('editStore').onclick = () => storeForm(s);
  if($('addFr')) $('addFr').onclick = () => franchiseeForm(s);
  if($('mkTab')) $('mkTab').onclick = () => confirmSheet('Create tablet login', `This makes the login that the ${s.name} counter tablet signs in with. You’ll see its email and password once, on the next screen.`, 'Create tablet login',
      async () => { const r = await hqCall('tablet_create', {store_id:s.id}); await refreshPeople(); tabletResult(s, r) });
  document.querySelectorAll('[data-link]').forEach(b => b.onclick = () => runSheet('Making a setup link…', async () => {
    const f = P.people.find(p=>p.id===b.dataset.link), r = await hqCall('setup_link', {user_id:f.id}); linkResult(f.name||f.email, f.email, r.link) }));
  document.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { const f = P.people.find(p=>p.id===b.dataset.remove), other = f.stores.length > 1;
    confirmSheet('Remove franchisee', `${f.name||f.email} will no longer see ${s.name}. ${other ? 'They keep access to their other stores.' : 'This is their only store, so their login is turned off. Adding them to a store again turns it back on.'} Past sales are not affected.`, 'Remove from this store',
      async () => { await hqCall('remove_franchisee', {user_id:f.id, store_id:s.id}); await refreshPeople(); P.msg = `${f.name||f.email} removed from ${s.name}.`; closeEditor(); drawStores() }, true) });
  document.querySelectorAll('[data-tabpw]').forEach(b => b.onclick = () => { const t = P.people.find(p=>p.id===b.dataset.tabpw);
    confirmSheet(t.off ? 'Turn tablet back on' : 'New tablet password', t.off ? 'This turns the tablet login back on with a new password. Type it on the tablet: ⚙ Settings → Sign out, then Set up this tablet.'
      : 'Only needed for a new or reset tablet. A tablet that is already signed in stays signed in. You’ll see the new password once.', t.off ? 'Turn back on' : 'Make new password',
      async () => { const r = await hqCall('tablet_password', {user_id:t.id}); await refreshPeople(); tabletResult(s, r) }) });
  document.querySelectorAll('[data-taboff]').forEach(b => b.onclick = () => { const t = P.people.find(p=>p.id===b.dataset.taboff);
    confirmSheet('Turn off tablet login', `Use this if the ${s.name} tablet is lost or the store closed. Within an hour the tablet stops syncing; anything it hasn’t sent stays on the tablet. Selling at the counter needs this login, so don’t do this to a working store.`, 'Turn off tablet',
      async () => { await hqCall('tablet_off', {user_id:t.id}); await refreshPeople(); P.msg = `${s.name} tablet login turned off.`; closeEditor(); drawStores() }, true) });
  if($('addCrew')) $('addCrew').onclick = () => crewForm(s);
  document.querySelectorAll('[data-pinreset]').forEach(b => b.onclick = () => { const c = P.crew.find(x=>x.id===b.dataset.pinreset);
    confirmSheet('Reset PIN', `${c.name}’s PIN is cleared. Next time they tap their name on the tablet (with internet), it asks them to make a new 4-digit PIN.`, 'Reset PIN',
      async () => { await crewUpdate(c, {pin_hash:null}); P.pin[c.id] = false; P.msg = `${c.name}’s PIN was reset.`; closeEditor(); drawStores() }) });
  document.querySelectorAll('[data-crewoff]').forEach(b => b.onclick = () => { const c = P.crew.find(x=>x.id===b.dataset.crewoff);
    confirmSheet('Turn off crew', `${c.name} disappears from the ${s.name} tablet within 5 minutes and can’t open shifts or clock in. Their past sales and time records stay.`, 'Turn off',
      async () => { await crewUpdate(c, {active:false}); P.msg = `${c.name} turned off.`; closeEditor(); drawStores() }, true) });
  document.querySelectorAll('[data-crewon]').forEach(b => b.onclick = async () => { const c = P.crew.find(x=>x.id===b.dataset.crewon);
    try{ await crewUpdate(c, {active:true}); P.msg = `${c.name} is back on the tablet within 5 minutes.`; drawStores() }catch(e){ P.msg = ''; alert(e.message) } });
  loadPins(crew.filter(c=>c.active && P.pin[c.id]===undefined));
}
async function loadPins(list){
  await Promise.all(list.map(async c => { try{ const r = await sb.rpc('crew_has_pin', {p_crew:c.id}); if(!r.error) P.pin[c.id] = !!r.data }catch(_){} }));
  list.forEach(c => { const el = document.querySelector(`[data-pinfor="${c.id}"]`); if(!el || P.pin[c.id]===undefined) return;
    el.textContent = P.pin[c.id] ? 'PIN set' : 'No PIN yet: makes one on the tablet';
    const rb = document.querySelector(`[data-pinreset="${c.id}"]`); if(rb) rb.hidden = !P.pin[c.id] });
}
async function refreshPeople(){ try{ P.people = (await hqCall('people')).people || [] }catch(_){} }
async function crewUpdate(c, data){
  const r = await sb.from('crew').update(data).eq('id', c.id).select('id,store_id,name,active');
  if(r.error || !r.data || !r.data.length) throw new Error(r.error && /fetch|network/i.test(r.error.message||'') ? NET : 'Couldn’t save. You can only change crew at your own stores.');
  Object.assign(c, r.data[0]);
}

// ---- sheets: forms, confirmations, results (reuse the menu editor's sheet) ----
function openSheet(title, inner){
  closeEditor();
  const bg = document.createElement('div'); bg.id = 'sheet'; bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="top"><h2>${esc(title)}</h2><button class="x" id="s_x" aria-label="Close">×</button></div>${inner}<div id="s_err"></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', e => { if(e.target===bg) closeEditor() });
  $('s_x').onclick = closeEditor;
}
const sheetErr = m => { const e = $('s_err'); if(e) e.innerHTML = m ? `<div class="callout">${esc(m)}</div>` : '' };
// a button that runs fn; on failure the sheet stays open with the reason
function busy(btn, label, fn){
  btn.onclick = async () => { const t = btn.textContent; btn.disabled = true; btn.textContent = label; sheetErr('');
    try{ await fn() }catch(e){ sheetErr(e.message || NET); if(document.body.contains(btn)){ btn.disabled = false; btn.textContent = t } } };
}
function confirmSheet(title, text, label, fn, danger){
  openSheet(title, `<p>${esc(text)}</p><div class="btnrow"><button class="btn" id="s_no">Cancel</button><button class="primary" id="s_yes" ${danger?'style="background:var(--bad);color:#fff"':''}>${esc(label)}</button></div>`);
  $('s_no').onclick = closeEditor; busy($('s_yes'), 'Working…', fn);
}
async function runSheet(label, fn){ openSheet(label, `<p class="empty">${esc(label)}</p>`); try{ await fn() }catch(e){ sheetErr(e.message || NET) } }

function storeForm(s){
  const isNew = !s;
  openSheet(isNew ? 'Add store' : 'Edit store', `
    <div class="field"><label for="f_name">Store name</label><input id="f_name" autocomplete="off" placeholder="e.g. Malolos Crossing" value="${esc(s?s.name:'')}"></div>
    <div class="field"><label for="f_code">Short code</label><input id="f_code" autocomplete="off" maxlength="6" style="text-transform:uppercase" value="${esc(s?s.code:'')}" ${isNew?'':'disabled'}>
      <small>${isNew ? '2–6 letters or numbers, like KRH. Used in the tablet login. Can’t be changed later.' : 'Can’t be changed.'}</small></div>
    <div class="field"><label for="f_addr">Address</label><input id="f_addr" autocomplete="off" value="${esc(s&&s.address?s.address:'')}"></div>
    <div class="field"><label for="f_type">Type</label><select id="f_type"><option value="fr" ${s&&!s.company_owned?'selected':''}>Franchise</option><option value="co" ${s&&s.company_owned?'selected':''}>Company-owned</option></select></div>
    <label class="switch"><span>VAT-registered store<br><small class="muted">Most small stores are non-VAT. This changes how Senior/PWD discounts are worked out.</small></span><input type="checkbox" id="f_vat" ${s&&s.vat_registered?'checked':''}></label>
    ${isNew ? '' : `<label class="switch"><span>Store is open<br><small class="muted">Closed stores move to the bottom of the list. Past sales stay.</small></span><input type="checkbox" id="f_open" ${s.active?'checked':''}></label>`}
    <button class="primary" id="f_save">${isNew ? 'Add store' : 'Save'}</button>`);
  let touched = !isNew;
  if(isNew){ $('f_code').oninput = () => { touched = true }; $('f_name').oninput = () => { if(!touched) $('f_code').value = autoCode($('f_name').value) }; $('f_name').focus() }
  busy($('f_save'), 'Saving…', async () => {
    const name = $('f_name').value.trim(), code = $('f_code').value.trim().toUpperCase();
    if(!name) throw new Error('Enter the store name.');
    if(isNew && !/^[A-Z0-9]{2,6}$/.test(code)) throw new Error('Short code: 2 to 6 letters or numbers, no spaces.');
    if(isNew && P.stores.some(x=>x.code.toUpperCase()===code)) throw new Error(`${code} is already used by ${P.stores.find(x=>x.code.toUpperCase()===code).name}. Pick another code.`);
    const data = {name, address: $('f_addr').value.trim() || null, company_owned: $('f_type').value==='co', vat_registered: $('f_vat').checked};
    if(!isNew) data.active = $('f_open').checked; else data.code = code;
    const r = isNew ? await sb.from('stores').insert(data).select() : await sb.from('stores').update(data).eq('id', s.id).select();
    if(r.error || !r.data || !r.data.length) throw new Error(r.error && r.error.code==='23505' ? 'That short code is already used. Pick another.' : r.error && /fetch|network/i.test(r.error.message||'') ? NET : 'Couldn’t save. Only HQ logins can add or change stores.');
    P.sel = r.data[0].id;
    P.msg = isNew ? `${name} added. Next: create its tablet login${data.company_owned ? '' : ', add the franchisee'} and add its crew.` : 'Saved.';
    closeEditor(); showStores();
  });
}

function franchiseeForm(s){
  openSheet('Add franchisee', `<p class="muted">They’ll get a link to choose their own password. They see only ${esc(s.name)}’s sales and crew${P.stores.length>1?' (plus any other store you add them to)':''}.</p>
    <div class="field"><label for="f_fname">Full name</label><input id="f_fname" autocomplete="off"></div>
    <div class="field"><label for="f_email">Email</label><input id="f_email" type="email" autocomplete="off" inputmode="email" placeholder="name@gmail.com"><small>This becomes their login. Already a franchisee at another store? Use the same email.</small></div>
    <div class="field"><label for="f_mobile">Mobile (optional)</label><input id="f_mobile" type="tel" autocomplete="off" placeholder="09XX XXX XXXX"></div>
    <button class="primary" id="f_save">Create login</button>`);
  $('f_fname').focus();
  busy($('f_save'), 'Creating…', async () => {
    const name = $('f_fname').value.trim(), email = $('f_email').value.trim(), mobile = $('f_mobile').value.trim();
    if(!name) throw new Error('Enter their full name.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Enter a valid email address, like name@gmail.com.');

}

function crewForm(s){
  openSheet('Add crew', `<div class="field"><label for="f_cname">Name as it should show on the tablet</label><input id="f_cname" autocomplete="off" placeholder="e.g. Jovy"></div>
    <p class="muted">They make their own 4-digit PIN the first time they tap their name on the ${esc(s.name)} tablet.</p>
    <button class="primary" id="f_save">Add crew</button>`);
  $('f_cname').focus();
  busy($('f_save'), 'Adding…', async () => {
    const name = $('f_cname').value.trim();
    if(!name) throw new Error('Enter their name.');

    if(r.error || !r.data || !r.data.length) throw new Error(r.error && /fetch|network/i.test(r.error.message||'') ? NET : 'Couldn’t save. You can only add crew at your own stores.');

// ---------- first visit from a setup link: choose a password ----------
// The link is pos.sagoloco.com/hq/#setup=<one-time token>. The token sits after "#", so it never reaches
// a server and a chat app's link preview can't use it up; it is only spent when they press the button.
function renderSetPassword(token, msg){
  $('app').innerHTML = `<div class="signin"><p class="eyebrow">Sago Loco</p><h1>Welcome! Choose your password</h1>
    <p class="muted">You’ll use it with your email to sign in at pos.sagoloco.com/hq.</p>
    <form id="f" class="card">
      <div class="field"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></div>
      <div class="field"><label for="p2">Type it again</label><input id="p2" type="password" autocomplete="new-password" required></div>
      ${msg ? `<div class="callout">${esc(msg)}</div>` : ''}
      <button class="primary" id="go">Save password and sign in</button>
    </form></div>`;
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = $('p1').value, p2 = $('p2').value;
    if(p1.length < 8) return renderSetPassword(token, 'Use at least 8 characters.');
    if(p1 !== p2) return renderSetPassword(token, 'The two passwords don’t match. Type them again.');
    $('go').disabled = true; $('go').textContent = 'Saving…';
    try{
      if(!(await sb.auth.getSession()).data.session || !V.setupOk){
        const v = await sb.auth.verifyOtp({token_hash: token, type: 'recovery'});
        if(v.error){ history.replaceState(null, '', location.pathname); renderSignin('This setup link has expired or was already used. Ask HQ for a new one.'); return }
        V.setupOk = true;   // the token is spent now; keep the session if the password step fails
      }
      const u = await sb.auth.updateUser({password: p1});
      if(u.error) return renderSetPassword(token, /weak|short|least/i.test(u.error.message||'') ? 'That password is too easy to guess. Try a longer one.' : 'Couldn’t save the password. Check the internet and try again.');
      history.replaceState(null, '', location.pathname);
      start();
    }catch(_){ renderSetPassword(token, NET) }
  });
}

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && V.role && V.tab==='sales' && V.R && V.R.live) load(true) });
const setupToken = (location.hash.match(/[#&]setup=([^&]+)/) || [])[1];
if(setupToken) sb.auth.signOut({scope:'local'}).finally(() => renderSetPassword(decodeURIComponent(setupToken)));
else start().catch(()=>renderSignin('Couldn’t reach the server. Check the internet and try again.'));
</script>
</body>
</html>
