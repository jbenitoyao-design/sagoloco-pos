<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sago Loco POS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6B3FA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SL POS">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen counter app. Menu grid fills the left, the order ticket rails on the right; on phones the ticket folds into a bottom bar. */
:root{
  --bg:#F4F3F6; --surface:#FFFFFF; --surface-2:#ECEAF0; --ink:#251C2E; --muted:#6B6475; --line:#DEDAE4;
  --accent:#F2A20C; --accent-ink:#251C2E; --hi:#6B3FA0; --hi-ink:#FFFFFF; --ube:#6B3FA0; --good:#1E8549; --bad:#C2412D; --good-bg:#E3F3E9; --bad-bg:#FBE7E3;
  --s-mango:#E99A06; --s-ube:#7B4BB5; --s-classic:#23968A; --s-ova:#8A5A3C; --s-kitkat:#D3392F; --s-cafe:#6F4E37;
  --shadow:0 10px 40px rgba(37,28,46,.18);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141118; --surface:#1E1A24; --surface-2:#2A2432; --ink:#F2EEF6; --muted:#A99FB3; --line:#383040;
  --accent:#F5B23A; --accent-ink:#1A1420; --hi:#B892E6; --hi-ink:#1A1420; --ube:#B892E6; --good:#55C987; --bad:#F27560; --good-bg:#183324; --bad-bg:#3A1C17;
  --s-mango:#F5B23A; --s-ube:#A97FE0; --s-classic:#45C0B2; --s-ova:#C08A64; --s-kitkat:#F0675C; --s-cafe:#B48B6C;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141118; --surface:#1E1A24; --surface-2:#2A2432; --ink:#F2EEF6; --muted:#A99FB3; --line:#383040;
  --accent:#F5B23A; --accent-ink:#1A1420; --hi:#B892E6; --hi-ink:#1A1420; --ube:#B892E6; --good:#55C987; --bad:#F27560; --good-bg:#183324; --bad-bg:#3A1C17;
  --s-mango:#F5B23A; --s-ube:#A97FE0; --s-classic:#45C0B2; --s-ova:#C08A64; --s-kitkat:#F0675C; --s-cafe:#B48B6C;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* stop iPhone double-tap zoom on fast taps (PIN pad, +/-); pinch zoom still works */
html,button,a,label,input{touch-action:manipulation}
.pad button,.qty button,.tile,.size,.pill{-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ube);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.off{background:var(--accent)}
.dot.bad{background:var(--bad)}
.eyebrow{margin:0 0 6px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.top .spacer{flex:1}
.btn{padding:10px 14px;border-radius:10px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.cog{width:46px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.mitem{width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;display:flex;flex-direction:column;gap:2px}
.mitem small{font-weight:500;font-size:13px;color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.demo{background:var(--accent);color:var(--accent-ink)}
.demo button{text-decoration:underline;font-weight:700}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding-bottom:16px}
.menu{min-height:0;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
.seg button{padding:9px 16px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px;align-content:start;padding:2px 2px 8px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px 18px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;overflow:hidden;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--sc)}
.tile b{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;letter-spacing:-.01em}
.tile .pr{font-size:14px;color:var(--muted);font-weight:600}
.tile .pr span{color:var(--ink)}

/* ticket */
.ticket{min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.t-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-head h2{margin:0;font-family:var(--f-display);font-size:18px}
.t-head .ch{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lines{flex:1;min-height:0;overflow-y:auto;padding:6px 16px}
.empty{color:var(--muted);text-align:center;padding:40px 12px;line-height:1.5}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:700}
.line .sub{font-size:12.5px;color:var(--muted);grid-column:1}
.line .amt{text-align:right;font-weight:700}
.line .amt s{display:block;font-weight:500;color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:6px;grid-column:2;justify-self:end}
.qty button{width:42px;height:42px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:16px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--good-bg);color:var(--good);margin-top:3px}
.t-foot{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:8px}
.row.muted{color:var(--muted);font-size:14px}
.row.total{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.charge{margin-top:8px;padding:16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px}
.charge[disabled]{opacity:.4;cursor:not-allowed}
.clear{font-size:13px;color:var(--muted);text-decoration:underline;align-self:center}

.mbar{display:none}
.t-close,#scrim{display:none}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(20,14,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:100%;overflow-y:auto;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:24px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.sheet h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:20px;line-height:1;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:12px 14px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:15px;min-height:46px}
.pill[aria-pressed="true"]{background:var(--ube);color:#fff;border-color:var(--ube)}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.size{padding:22px 10px;min-height:88px;justify-content:center;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.size b{font-family:var(--f-display);font-size:24px}
.size span{font-size:17px}
.size small{font-size:12.5px;font-weight:700;opacity:.85}
/* Grande is the upsell: purple, gently pulsing, shows how little more it costs */
.size.grande{background:var(--hi);color:var(--hi-ink);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.size.grande{animation:none}}
.size span{font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input{font:inherit;font-size:22px;font-weight:700;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.big{font-family:var(--f-display);font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.callout{padding:12px 14px;border-radius:12px;background:var(--surface-2);display:flex;justify-content:space-between;gap:10px;font-weight:700}
.callout.good{background:var(--good-bg);color:var(--good)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}

/* full screens: open shift, close shift, report */
.screen{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.panel h1{margin:0;font-family:var(--f-display);font-size:32px;letter-spacing:-.02em;line-height:1.05}
.crew{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.crew button{padding:18px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:17px;text-align:left}
.crew button[aria-pressed="true"]{border-color:var(--ube)}
.pins{display:flex;gap:10px;justify-content:center}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pins i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;width:100%;margin:0 auto}
.pad button{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 0;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl td:last-child,.tbl th:last-child,.tbl td.r{text-align:right}
.sale{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.sale .no{font-weight:800}
.sale .it{color:var(--muted);font-size:13.5px}
.sale.void .amt,.sale.void .it{text-decoration:line-through}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--surface-2);text-transform:uppercase;letter-spacing:.04em}
.tag.v{background:var(--bad-bg);color:var(--bad)}
.voidbox{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bad-bg);border-radius:12px}

.tc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center}
.tc h2{margin:0;font-family:var(--f-display);font-size:20px}
.st{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.st.in{background:var(--good-bg);color:var(--good)}
.st.break{background:var(--accent);color:var(--accent-ink)}
.tc .times{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.tc .times b{color:var(--ink)}
.shots{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.shot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.shot img,.shot span.ph{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:block}
.acts{display:grid;gap:10px}
/* upsell bursts: transform + opacity only, pointer-events off, gone in under a second */
.fx{position:fixed;width:0;height:0;z-index:50;pointer-events:none}
.fx i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;animation:burst .7s cubic-bezier(.2,.7,.3,1) forwards}
.fx i.lg{left:-6px;top:-6px;width:12px;height:12px;border-radius:3px}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg);opacity:0}}
.fx b{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--hi);text-shadow:0 2px 0 var(--surface),0 0 12px var(--surface);animation:rise .85s ease-out forwards}
.fx.big b{font-size:34px}
@keyframes rise{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}20%{transform:translate(-50%,-90%) scale(1.15);opacity:1}100%{transform:translate(-50%,-200%) scale(1);opacity:0}}
.chip.ups{background:var(--hi);color:var(--hi-ink)}
.chip.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr);padding-bottom:84px}
  .ticket{position:fixed;inset:auto 0 0 0;z-index:15;border-radius:20px 20px 0 0;max-height:85%;transform:translateY(105%);transition:transform .2s;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
  .ticket.open{transform:none}
  .t-close{display:inline-flex;padding:8px 12px;font-size:14px}
  #scrim.on{display:block;position:fixed;inset:0;z-index:14;background:rgba(20,14,26,.5)}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:12;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
  .mbar .view{flex:1;text-align:left;font-weight:700}
  .mbar .view small{display:block;color:var(--muted);font-weight:600}
  .mbar .charge{margin:0;padding:12px 18px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:520px){.top .hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <div class="brand">Sago Loco POS<small id="storeName">Karuhatan</small></div>
    <span class="chip" id="shiftChip"></span>
    <span class="chip ups num" id="upsChip"></span>
    <span class="chip" id="syncChip"><i class="dot"></i>Starting…</span>
    <span class="chip demo" id="demoChip" hidden>Demo data</span>
    <span class="spacer"></span>
    <button class="btn cog" data-act="menu" aria-label="Settings and shift tools"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.3-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg></button>
  </header>
  <div class="main">
    <section class="menu" aria-label="Menu">
      <div class="seg" role="group" aria-label="Order source" id="chSeg"></div>
      <div class="cats" role="group" aria-label="Series" id="cats"></div>
      <div class="grid" id="grid"></div>
    </section>
    <aside class="ticket" id="ticket" aria-label="Current order"></aside>
  </div>
  <div class="mbar" id="mbar"></div>
</div>
<div id="scrim" data-act="hideticket"></div>
<div class="ov" id="ov" hidden></div>
<div class="screen" id="screen" hidden></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

function lineAmt(l){
  const gross = (l.base + l.top) * l.qty;
  let disc = 0;
  const p = l.promo && promoById[l.promo];
  if(p && p.free) disc = l.base * l.qty;           // free drink; toppings still paid
  // Senior/PWD: non-VAT store = 20% off; VAT store = remove 12% VAT first, then 20% off
  else if(p && p.pct) disc = STORE.vat ? Math.round((gross - gross / 1.12 * (1 - p.pct/100)) * 100) / 100 : Math.round(gross * p.pct) / 100;
  return {gross, disc, net: gross - disc};
}
function totals(lines){ return lines.reduce((a,l)=>{ const x = lineAmt(l); a.gross+=x.gross; a.disc+=x.disc; a.net+=x.net; return a }, {gross:0,disc:0,net:0}) }

// ---- live mode: outbox + background sync ----
// Every sale, void, shift and time log is saved on the tablet first, then sent in order.
// Each record carries an id made here, so sending it twice never creates a duplicate.
let syncing = false;
function enqueue(op){ if(MODE!=='live') return; S.outbox.push(op); save(); renderSync(); sync() }
async function pushOp(op){
  let r;
  if(op.op==='shift') r = await sb.from('shifts').upsert(op.row, {onConflict:'id', ignoreDuplicates:true});
  else if(op.op==='sale'){
    r = await sb.from('sales').upsert(op.sale, {onConflict:'id', ignoreDuplicates:true});
    if(!r.error) r = await sb.from('sale_lines').upsert(op.lines, {onConflict:'id', ignoreDuplicates:true});
  }
  else if(op.op==='void') r = await sb.from('sales').update({voided_at:op.voided_at, void_reason:op.void_reason, voided_by:op.voided_by}).eq('id', op.id);
  else if(op.op==='close') r = await sb.from('shifts').update({closed_at:op.closed_at, counted_cash:op.counted_cash}).eq('id', op.id);
  else if(op.op==='time'){
    const perr = await pushSelfie(op); if(perr) return perr;
    r = await sb.from('time_logs').upsert(op.row, {onConflict:'id', ignoreDuplicates:true});
  }
  return r && r.error ? r.error : null;
}
// selfie goes to private storage first, then the time record points at it.
// The photo rides in the outbox only until it is uploaded, then leaves the tablet's queue.
async function pushSelfie(op){
  if(!op.photo || op.row.photo_path) return null;
  const path = op.path || (op.row.store_id + '/' + new Date(op.row.at).toLocaleDateString('en-CA') + '/' + op.row.id + '.jpg');
  const blob = await (await fetch(op.photo)).blob();
  const up = await sb.storage.from('selfies').upload(path, blob, {contentType:'image/jpeg', upsert:false});
  const st = up.error ? +(up.error.status || up.error.statusCode || 0) : 0;
  const exists = up.error && (st===409 || /exist|duplicate/i.test(up.error.message||''));
  if(up.error && !exists){
    if(st >= 400 && st < 500){            // refused (not a network hiccup): keep the time, flag the photo for HQ
      S.failed.push({op:'selfie', id:op.row.id, error:'Selfie not saved: ' + (up.error.message||st)});
      delete op.photo; save(); return null;
    }
    return up.error;                       // offline or server busy: try again on the next sync
  }
  op.row.photo_path = path; delete op.photo; save();
  return null;
}
// 90-day rule, no exceptions: once a day the tablet deletes its store's selfies older than 90 days.
// The database only allows deleting photos past 90 days, so nothing newer can be removed by mistake.
async function cleanOldSelfies(){
  if(MODE!=='live' || !sb || !navigator.onLine || !S.storeId) return;
  const today = new Date().toLocaleDateString('en-CA');
  if(S.lastSelfieClean === today) return;
  try{
    const cut = new Date(Date.now() - 91*864e5).toLocaleDateString('en-CA');
    const dirs = await sb.storage.from('selfies').list(S.storeId, {limit:1000});
    if(dirs.error) return;
    for(const d of dirs.data.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.name) && x.name < cut)){
      const files = await sb.storage.from('selfies').list(S.storeId + '/' + d.name, {limit:1000});
      if(files.error || !files.data.length) continue;
      const rm = await sb.storage.from('selfies').remove(files.data.map(f => S.storeId + '/' + d.name + '/' + f.name));
      if(rm.error) return;
    }
    S.lastSelfieClean = today; save();
  }catch(_){ /* try again tomorrow */ }
}
// a database refusal (bad data, not allowed) won't fix itself by retrying; a network or login hiccup will
const isPermanent = e => /^(22|23|42|P0)/.test(String(e && e.code || ''));
async function sync(){
  if(MODE!=='live' || syncing || !sb || !navigator.onLine || !S.outbox.length){ renderSync(); return }
  syncing = true; renderSync();
  try{
    while(S.outbox.length){
      const op = S.outbox[0], err = await pushOp(op);
      if(err){
        if(isPermanent(err)){ S.failed.push(Object.assign({}, op, {error: String(err.message || err.code)})); S.outbox.shift(); save(); continue }
        break;
      }
      S.outbox.shift(); S.lastSync = Date.now(); save();
    }
  }catch(_){ /* offline mid-send: the rest waits for the next try */ }
  finally{ syncing = false; renderSync() }
}
function renderSync(){
  const el = $('syncChip'); if(!el) return;
  if(MODE!=='live'){ el.innerHTML = '<i class="dot off"></i>Demo · this device only'; return }
  const n = S.outbox.length, f = (S.failed||[]).length, on = navigator.onLine;
  let txt, cls = '';
  if(f){ txt = f + ' couldn’t sync · tell HQ'; cls = ' bad' }
  else if(!on){ txt = n ? 'Offline · ' + n + ' waiting' : 'Offline · still saving'; cls = ' off' }
  else if(n){ txt = 'Syncing ' + n + '…'; cls = ' off' }
  else txt = 'All synced';
  el.innerHTML = `<i class="dot${cls}"></i>${txt}`;
}

function prune(){
  if(MODE!=='live') return;
  const cut = Date.now() - 2*864e5, open = S.shift && S.shift.id;
  S.sales = S.sales.filter(s => s.at > cut || s.shiftId===open);

// ---- crew PINs: checked by the server; remembered on this tablet so they still work offline ----
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('') }
async function checkPin(crewId, pin){
  if(MODE==='demo'){ const c = S.crew.find(x=>x.id===crewId); return {ok: !!c && c.pin===pin} }
  const key = await sha(crewId + ':' + pin);
  if(navigator.onLine && sb){
    try{
      const r = await sb.rpc('verify_crew_pin', {p_crew:crewId, p_pin:pin});
      if(r.error) throw r.error;
      if(r.data){ S.pinCache[crewId] = key; save() }
      return {ok: !!r.data};
    }catch(_){ /* server unreachable: use the remembered PIN */ }
  }
  if(S.pinCache[crewId]) return {ok: S.pinCache[crewId]===key};
  return {ok:false, msg:'Needs internet to check this PIN the first time.'};
}
async function hasPin(crewId){
  if(MODE==='demo' || S.pinCache[crewId] || !navigator.onLine || !sb) return true;
  try{ const r = await sb.rpc('crew_has_pin', {p_crew:crewId}); if(r.error) throw r.error; return !!r.data }catch(_){ return true }
}
async function claimPin(crewId, pin){
  try{
    const r = await sb.rpc('claim_crew_pin', {p_crew:crewId, p_pin:pin});
    if(r.error) return {ok:false, msg:'Couldn’t save the PIN. Check the internet and try again.'};
    if(!r.data) return {ok:false, msg:'This crew member already has a PIN. Ask HQ to reset it.'};
    S.pinCache[crewId] = await sha(crewId + ':' + pin); save();
    return {ok:true};
  }catch(_){ return {ok:false, msg:'Couldn’t save the PIN. Check the internet and try again.'} }
}
const newPinState = extra => Object.assign({crew:null, pin:'', phase:'enter', first:'', status:null, msg:''}, extra||{});
async function pickCrew(st, id, rerender){
  Object.assign(st, {crew:id, pin:'', phase:'enter', first:'', status:null, msg:''}); rerender();
  if(MODE==='live' && !(await hasPin(id)) && st.crew===id){ st.phase = 'new'; rerender() }
}
async function pinKey(st, k, rerender){
  if(st.status==='checking' || st.status==='ok') return;
  if(k==='⌫'){ st.pin = st.pin.slice(0,-1); st.status = null; st.msg = ''; rerender(); return }
  if(st.pin.length>=4){ st.pin = ''; st.status = null; st.msg = '' }
  st.pin += k; rerender();
  if(st.pin.length<4) return;
  if(st.phase==='new'){ st.first = st.pin; st.pin = ''; st.phase = 'confirm'; rerender(); return }
  st.status = 'checking'; rerender();
  if(st.phase==='confirm'){
    if(st.pin!==st.first){ Object.assign(st, {phase:'new', first:'', pin:'', status:'bad', msg:'The two PINs didn’t match. Start again.'}); rerender(); return }
    const r = await claimPin(st.crew, st.pin);
    Object.assign(st, r.ok ? {status:'ok', msg:'', phase:'enter'} : {status:'bad', msg:r.msg, pin:'', phase:'new', first:''});
    rerender(); return;
  }
  const r = await checkPin(st.crew, st.pin);
  Object.assign(st, r.ok ? {status:'ok', msg:''} : {status:'bad', msg:r.msg || 'Wrong PIN. Try again.'});
  rerender();
}
function pinHtml(st, act){
  const name = esc(crewName(st.crew));
  const head = st.phase==='new' ? `${name}, create your 4-digit PIN` : st.phase==='confirm' ? 'Enter the same PIN again' : `${name}, enter your PIN`;
  return `<div class="field"><h3>${head}</h3>${st.phase!=='enter' ? '<p class="hint">First time on this tablet. Choose 4 numbers only you know.</p>' : ''}
    <div class="pins">${[0,1,2,3].map(i=>`<i class="${i<st.pin.length?'on':''}"></i>`).join('')}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-act="${act}" data-k="${k}">${k}</button>`).join('')}</div>
    ${st.status==='checking' ? '<div class="callout">Checking…</div>' : ''}${st.status==='bad' ? `<div class="callout bad">${esc(st.msg)}</div>` : ''}</div>`;

function summary(sh){
  const all = shiftSales(sh.id), ok = all.filter(s=>!s.void);
  const sum = f => ok.reduce((a,s)=>a+f(s),0);
  const by = (key) => { const m = {}; ok.forEach(s=>{ m[s[key]] = (m[s[key]]||0) + s.total }); return m };
  const mix = {}, promos = {}, sc = [];
  ok.forEach(s=>s.lines.forEach(l=>{
    const k = lineName(l), a = lineAmt(l);
    mix[k] = mix[k] || {q:0,amt:0}; mix[k].q += l.qty; mix[k].amt += a.net;
    if(l.promo){ const pn = (promoById[l.promo]||{n:l.promo}).n; promos[pn] = promos[pn] || {q:0,amt:0}; promos[pn].q += l.qty; promos[pn].amt += a.disc }
    if(l.sc) sc.push({no:s.no, type:l.sc.type, name:l.sc.name, id:l.sc.id, disc:a.disc});
  }));
  const cashSales = sum(s=>s.pay==='cash'?s.total:0);
  return {all, ok, net:sum(s=>s.total), disc:sum(s=>s.disc), n:ok.length, voids:all.filter(s=>s.void),
    byPay:by('pay'), byCh:by('ch'), mix, promos, sc, cashSales, expected: sh.startCash + cashSales};
}

      <h3 style="margin-top:8px">By order source</h3>${Object.entries(m.byCh).map(([k,v])=>`<div class="row"><span>${chN(k)}</span><span>${peso(v)}</span></div>`).join('')||'<span class="hint">None</span>'}</div>

// ---- time clock: selfie in/out and breaks, separate from who runs the register ----
const TC_LABEL = {in:'Time in', bstart:'Start break', bend:'End break', out:'Time out'};
const isToday = t => new Date(t).toDateString() === new Date().toDateString();
const hm = ms => { const m = Math.max(0, Math.round(ms/60000)); return Math.floor(m/60) + 'h ' + (m%60) + 'm' };
function crewDay(id){
  const ev = S.time.filter(e=>e.crewId===id && isToday(e.at)).sort((a,b)=>a.at-b.at);
  let status = 'out', worked = 0, brk = 0, inAt = null, bAt = null;
  ev.forEach(e=>{
    if(e.type==='in'){ status = 'in'; inAt = e.at }
    else if(e.type==='bstart' && inAt){ worked += e.at - inAt; inAt = null; bAt = e.at; status = 'break' }
    else if(e.type==='bend' && bAt){ brk += e.at - bAt; bAt = null; inAt = e.at; status = 'in' }
    else if(e.type==='out'){ if(inAt) worked += e.at - inAt; if(bAt) brk += e.at - bAt; inAt = bAt = null; status = 'out' }
  });
  if(inAt) worked += Date.now() - inAt;
  if(bAt) brk += Date.now() - bAt;
  return {ev, status, worked, brk};
}
// one break per day, matching the handbook's single 1-hour meal break (JB 11.13.2026)
const breakUsed = d => d.ev.some(e => e.type==='bstart');
const nextActs = d => d.status==='out' ? ['in'] : d.status==='in' ? (breakUsed(d) ? ['out'] : ['bstart','out']) : ['bend'];
let tc = newPinState({act:null});
function renderClock(){
  const c = tc.crew && S.crew.find(x=>x.id===tc.crew), ok = !!c && tc.status==='ok';
  const stTxt = {in:'On duty', break:'On break', out:'Off duty'};
  let body;
  if(!c) body = S.crew.map(x=>{
    const d = crewDay(x.id), first = d.ev.find(e=>e.type==='in'), last = d.ev.filter(e=>e.type==='out').pop();
    return `<div class="card tc"><div><h2>${esc(x.name)}</h2><span class="st ${d.status}">${stTxt[d.status]}</span></div>
      <button class="btn primary" data-act="tcrew" data-id="${x.id}">${d.status==='out' ? 'Time in' : d.status==='break' ? 'End break' : breakUsed(d) ? 'Time out' : 'Break / out'}</button>
      <div class="times num"><span>In <b>${first?fmtTime(first.at):'—'}</b></span><span>Out <b>${last && d.status==='out'?fmtTime(last.at):'—'}</b></span><span>Worked <b>${hm(d.worked)}</b></span><span>Breaks <b>${hm(d.brk)}</b></span></div>
      ${d.ev.length?`<div class="shots">${d.ev.map(e=>`<div class="shot">${e.photo?`<img src="${e.photo}" alt="${esc(x.name)} ${TC_LABEL[e.type]} selfie">`:'<span class="ph"></span>'}${TC_LABEL[e.type]} ${fmtTime(e.at)}</div>`).join('')}</div>`:''}</div>`;
  }).join('') || '<p class="hint">No crew yet. Ask HQ to add this store’s crew.</p>';
  else if(!ok) body = pinHtml(tc, 'tpin');
  else if(!tc.act) body = `<div class="acts">${nextActs(crewDay(c.id)).map(a=>`<button class="charge" data-act="tact" data-a="${a}">${TC_LABEL[a]}</button>`).join('')}</div>`;
  else body = `<div class="card"><h3>${TC_LABEL[tc.act]} · ${esc(c.name)}</h3><p class="hint">Take a selfie at the counter so the time is confirmed.</p>
      <label class="charge" for="selfie" style="text-align:center">Open camera</label>
      <input type="file" id="selfie" accept="image/*" capture="user" hidden></div>`;
  showScreen(`<div class="panel"><div class="row"><h1>${c ? esc(c.name) : 'Time in / out'}</h1><button class="x" data-act="${c?'tback':'clockdone'}" aria-label="Back">×</button></div>
    ${body}<p class="hint">${MODE==='live' ? 'Times are confirmed by HQ’s server clock. Punches made without internet are marked for checking.' : 'Times use this tablet’s clock.'}</p>${demoPinHint()}</div>`);
}
function saveSelfie(file){
  if($('selfie')) $('selfie').value = '';   // so the same button works again right away
  // live camera only: a photo taken more than 3 minutes ago (e.g. picked from the gallery) is refused
  if(file.lastModified && Date.now() - file.lastModified > 3*60000){ toast('Use the camera to take a new selfie now. Saved photos can’t be used.'); return }
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = ()=>{
    // 360 px is enough to recognise the face and the background; keeps each photo around 20 KB
    const s = 360, cv = document.createElement('canvas'), k = Math.min(s/img.width, s/img.height, 1);
    cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
    const ev = {id: uid(), crewId:tc.crew, type:tc.act, at:Date.now(), photo:cv.toDataURL('image/jpeg', .65)};
    S.time.push(ev); save();
    enqueue({op:'time', photo:ev.photo, path:S.storeId + '/' + new Date(ev.at).toLocaleDateString('en-CA') + '/' + ev.id + '.jpg',
      // the database replaces this phone time with its own clock; offline punches are flagged for payroll (F-11)
      row:{id:ev.id, store_id:S.storeId, crew_id:ev.crewId, type:ev.type, at:iso(ev.at), photo_path:null, offline:!navigator.onLine}});
    toast(crewName(ev.crewId) + ': ' + TC_LABEL[ev.type] + ' at ' + fmtTime(ev.at));
    tc = newPinState({act:null}); renderClock();
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast('That photo could not be read. Try again.') };
  img.src = url;
}

// ---- upsell celebration (Grande + toppings) ----
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function upsellCount(){
  if(!S.shift) return 0;
  return shiftSales(S.shift.id).filter(s=>!s.void).reduce((a,s)=>a + s.lines.reduce((b,l)=>b + l.qty*((l.size==='G'?1:0) + l.tops.length), 0), 0);
}
function celebrate(el, big, label){
  try{ if(navigator.vibrate) navigator.vibrate(big ? [20,40,30] : 15) }catch(_){}
  if(reduceMotion || !el) return;
  const r = el.getBoundingClientRect(), layer = document.createElement('div');
  layer.className = 'fx' + (big ? ' big' : ''); layer.style.left = (r.left + r.width/2) + 'px'; layer.style.top = (r.top + r.height/2) + 'px';
  const n = big ? 20 : 9, cols = ['var(--s-mango)','var(--hi)','var(--s-classic)','var(--s-kitkat)'];
  let html = '';
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + Math.random()*.5, d = (big ? 90 : 45) + Math.random()*(big ? 70 : 30);
    html += `<i class="${big && i%3===0 ? 'lg' : ''}" style="--dx:${(Math.cos(a)*d).toFixed(1)}px;--dy:${(Math.sin(a)*d).toFixed(1)}px;background:${cols[i%4]}"></i>`;
  }
  layer.innerHTML = html + (label ? `<b>${label}</b>` : '');
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 950);
}

// ---- settings menu: shift tools that aren't needed every order ----
function renderMenu(){
  const item = (act, t, sub) => `<button class="mitem" data-act="${act}">${t}<small>${sub}</small></button>`;
  const live = MODE==='live', waiting = live ? S.outbox.length : 0;
  showOv(`<div class="sh-top"><div><h3>${esc(STORE.name)}</h3><h2>Shift tools</h2></div><button class="x" data-act="closeov" aria-label="Close">×</button></div>
    <div class="acts">${item('clock','Time in / out','Selfie clock-in, breaks, clock-out')}
    ${S.shift ? item('sales','Today’s sales','This shift’s sales and voids') + item('close','Close shift','Count the cash and print the Z report') : ''}
    ${live ? item('syncnow','Sync now', waiting ? waiting + ' waiting to send' : 'Everything is sent') : ''}
    ${live && !S.shift ? (UI.confirmSignout ? item('signout','Tap again to sign out','HQ will need the tablet login to set it up again') : item('signout','Sign out this tablet','For HQ: unlink this tablet from the store')) : ''}
    ${!live && S.demo ? item('reset','Reset demo','Reload the sample sales') : ''}
    ${!live ? item('setup','Set up this tablet','For HQ: connect it to a store') : ''}</div>`);
}

// ---- overlay plumbing ----
function showOv(html){ const o = $('ov'); o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; o.hidden = false }
function closeOv(){ $('ov').hidden = true; $('ov').innerHTML = ''; UI.pick = null; UI.pay = null; UI.voiding = null; UI.vreason = null; UI.confirmSignout = false }
function showScreen(html){ const s = $('screen'); s.innerHTML = html; s.hidden = false; s.scrollTop = 0 }
function closeScreen(){ $('screen').hidden = true; $('screen').innerHTML = '' }

// phone only: the order slides up over the menu; the scrim and "Back to menu" close it
function setTicket(open){ $('ticket').classList.toggle('open', open); $('scrim').classList.toggle('on', open) }

function renderAll(){ renderTop(); renderChannels(); renderGrid(); renderTicket(); if(!S.shift){ openState = newPinState({cash:''}); renderOpen() } }

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b){ if(e.target.id==='ov') closeOv(); return }
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case 'ch':
      if(UI.cart.length && id!==UI.ch){ toast('Finish or clear this order before switching to ' + CHANNELS.find(c=>c.id===id).n); return }
      UI.ch = id; renderChannels(); renderGrid(); renderTicket(); break;
    case 'cat': UI.cat = id; renderChannels(); renderGrid(); break;
    case 'pick': openPick(id); break;
    case 'ptop': { const t = UI.pick.tops, i = t.indexOf(id); if(i<0){ t.push(id); celebrate(b, false, '+' + peso(topById[id].p)) } else t.splice(i,1); renderPick(); break }
    case 'ppromo': UI.pick.promo = UI.pick.promo===id ? null : id; renderPick(); if(UI.pick.promo==='scpwd') $('scname').focus(); break;
    case 'sctype': UI.pick.sc.type = id; renderPick(); break;
    case 'add': addToCart(b.dataset.size, b); break;
    case 'inc': UI.cart[+b.dataset.i].qty++; renderTicket(); break;
    case 'dec': { const l = UI.cart[+b.dataset.i]; if(--l.qty<=0) UI.cart.splice(+b.dataset.i,1); renderTicket(); break }
    case 'clearcart': UI.cart = []; renderTicket(); break;
    case 'toggleticket': setTicket(!$('ticket').classList.contains('open')); break;
    case 'hideticket': setTicket(false); break;
    case 'charge': if(UI.cart.length) openPay(); break;
    case 'method': UI.pay.method = id; renderPay(); break;
    case 'tend': UI.pay.tendered = b.dataset.v; renderPay(); break;
    case 'complete': completeSale(); break;
    case 'closeov': closeOv(); break;
    case 'sales': if(S.shift){ renderSales() } break;
    case 'void': UI.voiding = id; UI.vreason = null; renderSales(); break;
    case 'vreason': UI.vreason = b.dataset.r; renderSales(); break;
    case 'vcancel': UI.voiding = null; renderSales(); break;
    case 'vconfirm': { const s = S.sales.find(x=>x.id===UI.voiding); s.void = {reason:UI.vreason, at:Date.now(), by:S.shift.crewId}; save();
      enqueue({op:'void', id:s.id, voided_at:iso(s.void.at), void_reason:s.void.reason, voided_by:s.void.by});
      UI.voiding = null; toast('Sale #' + s.no + ' voided'); renderSales(); renderTop(); break }
    case 'close': closeOv(); if(S.shift){ if(UI.cart.length){ toast('Finish or clear the current order first'); return } renderClose('') } break;
    case 'closescreen': closeScreen(); break;
    case 'staleclose': if(S.shift) renderClose(''); break;
    case 'stalekeep': if(S.shift) UI.staleKept = S.shift.id; closeScreen(); break;
    case 'menu': renderMenu(); break;
    case 'clock': closeOv(); tc = newPinState({act:null}); renderClock(); break;
    case 'clockdone': closeScreen(); if(!S.shift) renderOpen(); break;
    case 'tcrew': tc = newPinState({act:null}); pickCrew(tc, id, renderClock); break;
    case 'tback': tc = newPinState({act:null}); renderClock(); break;
    case 'tpin': pinKey(tc, b.dataset.k, renderClock); break;
    case 'tact': tc.act = b.dataset.a; renderClock(); break;
    case 'cclose': { const c = parseFloat($('counted').value); const sh = S.shift; sh.counted = c; sh.closedAt = Date.now(); S.shifts.push(sh); S.shift = null; save();
      enqueue({op:'close', id:sh.id, closed_at:iso(sh.closedAt), counted_cash:c});
      renderZ(sh); renderTop(); break }
    case 'newshift': openState = newPinState({cash:''}); renderOpen(); break;
    case 'ocrew': openState = newPinState({cash:''}); pickCrew(openState, id, renderOpen); break;
    case 'opin': pinKey(openState, b.dataset.k, renderOpen); break;
    case 'oopen': { const cash = parseFloat(openState.cash); if(isNaN(cash)) return;
      b.disabled = true; openShift(cash); break }
    case 'reset': try{ localStorage.removeItem(KEY_DEMO) }catch(_){} S = seed(); UI.cart = []; closeOv(); closeScreen(); renderAll(); toast('Demo reset'); break;
    case 'demo': startDemo(); break;
    case 'setup': closeOv(); renderSetup(); break;
    case 'syncnow': closeOv(); if(navigator.onLine){ refreshCatalog(); sync(); toast('Syncing…') } else toast('No internet right now. Everything is saved on this tablet.'); break;
    case 'signout':
      if(S.outbox.length){ toast('Wait until everything is synced before signing out'); return }
      if(!UI.confirmSignout){ UI.confirmSignout = true; renderMenu(); UI.confirmSignout = true; return }
      closeOv(); (sb ? sb.auth.signOut() : Promise.resolve()).finally(()=>{ try{ localStorage.removeItem(KEY_LIVE); localStorage.removeItem(KEY_MODE) }catch(_){} S = {crew:[], shift:null, sales:[], shifts:[], time:[], nextNo:1}; renderSetup() });
      break;
  }
});
document.addEventListener('submit', async e=>{
  if(e.target.id!=='setupForm') return;
  e.preventDefault();
  if(!sb){ renderSetup('Couldn’t load the sign-in tools. Check the internet and reload.'); return }
  const btn = $('su_btn'); btn.disabled = true; btn.textContent = 'Signing in…';
  const {error} = await sb.auth.signInWithPassword({email:$('su_email').value.trim(), password:$('su_pass').value});
  if(error){ renderSetup('Sign-in didn’t work: ' + error.message); return }
  await setupFromSession();
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id==='tendered'){ UI.pay.tendered = t.value; const tot = totals(UI.cart).net, v = parseFloat(t.value)||0;
    const chg = $('chg'); chg.className = 'callout num' + (v>=tot?' good':''); chg.lastElementChild.textContent = v>=tot ? peso(v-tot) : '—'; $('cpl').disabled = v<tot }
  if(t.id==='scname') UI.pick.sc.name = t.value;
  if(t.id==='scid') UI.pick.sc.id = t.value;
  if(t.id==='startcash'){ openState.cash = t.value; $('obtn').disabled = t.value==='' || isNaN(parseFloat(t.value)) }
  if(t.id==='counted'){ const sh = S.shift, m = summary(sh), c = parseFloat(t.value), has = t.value!=='' && !isNaN(c), d = has ? c - m.expected : 0, box = $('ovs');
    box.className = 'callout num' + (!has?'':Math.abs(d)<0.01?' good':' bad'); box.firstElementChild.textContent = !has?'Over / short':d>0?'Over':d<0?'Short':'Balanced';
    box.lastElementChild.textContent = has ? peso(Math.abs(d)) : '—'; $('cbtn').disabled = !has }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(!$('ov').hidden) closeOv(); else setTicket(false) }
  if(e.key==='Enter' && e.target.id==='tendered' && !$('cpl').disabled) completeSale();
});
document.addEventListener('change', e=>{ if(e.target.id==='selfie' && e.target.files[0]) saveSelfie(e.target.files[0]) });
addEventListener('online', ()=>{ renderSync(); refreshCatalog(); sync() });
addEventListener('offline', renderSync);
setInterval(()=>{ sync() }, 20000);
setInterval(async ()=>{ refreshCatalog(); cleanOldSelfies(); if(!(await checkShiftClosedByHQ())) maybeAskStale() }, 5*60000);

// ---- start: a set-up tablet opens straight to its store; otherwise HQ sets it up (or tries the demo) ----
(async function boot(){
  let session = null;
  if(sb){ try{ session = (await sb.auth.getSession()).data.session }catch(_){} }
  const live = loadKey(KEY_LIVE), mode = (()=>{ try{ return localStorage.getItem(KEY_MODE) }catch(_){ return null } })();
  if(live && live.storeId && mode==='live' && (session || !navigator.onLine)){
    MODE = 'live'; S = live; S.outbox = S.outbox||[]; S.failed = S.failed||[]; S.pinCache = S.pinCache||{}; S.time = S.time||[];
    if(S.catalog) applyLiveCatalog(S.catalog);
    prune(); save(); renderAll(); refreshCatalog(); sync(); cleanOldSelfies();
    if(!(await checkShiftClosedByHQ())) maybeAskStale(true);
    return;
  }
  if(session){ await setupFromSession(); return }
  if(mode==='demo'){ startDemo(); return }
  renderSetup();
})();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
